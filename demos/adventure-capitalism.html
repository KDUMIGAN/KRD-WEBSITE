<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Capitalism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* ── THEME: light is default ── */
    :root {
        --bg:#f5f6f8;--panel:#ffffff;--panel-alt:#eef0f3;
        --border:#d8dce3;--text:#1b1f27;--text-dim:#6b7280;
        --green:#1a9850;--red:#c0392b;--gold:#b8860b;
        --console-bg:#e8eaed;--console-text:#3a4050;
    }
    body.dark-theme {
        --bg:#0b0e11;--panel:#12161c;--panel-alt:#171c24;
        --border:#262c36;--text:#e6e9ef;--text-dim:#7c8494;
        --green:#2ecc71;--red:#e5533d;--gold:#f0b429;
        --console-bg:#08090b;--console-text:#2ecc71;
    }

    *{box-sizing:border-box;}
    body{
        font-family:'JetBrains Mono',monospace;font-size:14px;
        background:var(--bg);color:var(--text);
        margin:0;padding:0;
        transition:background .15s,color .15s;
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
    h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
    p{margin:3px 0;line-height:1.35;}

    button{
        font-family:'JetBrains Mono',monospace;background:var(--panel-alt);
        color:var(--text);border:1px solid var(--border);border-radius:3px;
        padding:6px 10px;margin-top:5px;margin-right:5px;cursor:pointer;font-size:13px;
    }
    button:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
    button:disabled{opacity:.35;cursor:not-allowed;}
    button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
    button.active-speed{border-color:var(--gold);color:var(--gold);background:var(--panel);}

    hr{border:none;border-top:1px solid var(--border);margin:6px 0;}
    .stat-label{color:var(--text-dim);}
    .up{color:var(--green);}.down{color:var(--red);}.gold{color:var(--gold);}
    input[type="range"]{accent-color:var(--gold);width:100%;vertical-align:middle;}

    /* ── CONSOLE (top bar) ── */
    #console{
        position:fixed;top:0;left:0;width:100%;height:52px;
        background:var(--console-bg);color:var(--console-text);
        border-bottom:1px solid var(--border);
        padding:4px 14px;font-family:'JetBrains Mono',monospace;
        z-index:100;display:flex;align-items:center;gap:12px;
    }
    #console h3{
        color:var(--text-dim);font-size:11px;text-transform:uppercase;
        letter-spacing:1px;white-space:nowrap;flex-shrink:0;
    }
    #consoleOutput{
        font-size:12px;overflow:hidden;white-space:nowrap;
        text-overflow:ellipsis;flex:1;
    }
    .story-log{color:var(--gold);}

    /* ── MAIN SCROLL AREA ── */
    #mainContent{
        padding:62px 16px 16px 16px; /* 62px clears the fixed console */
    }

    /* ── HEADER ── */
    .header-row{
        display:flex;align-items:center;justify-content:space-between;
        margin-bottom:6px;flex-wrap:wrap;gap:8px;
    }
    h1{font-size:18px;font-weight:700;letter-spacing:.5px;}
    h1 .tick{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;margin-left:6px;color:var(--text-dim);}

    .header-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

    #themeToggle{
        background:var(--panel-alt);border:1px solid var(--border);
        border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--text);font-size:12px;
        margin:0;
    }

    /* Speed buttons inline in header */
    .speed-group{display:flex;gap:3px;align-items:center;}
    .speed-group span{font-size:11px;color:var(--text-dim);margin-right:2px;}
    .speed-group button{
        padding:4px 8px;font-size:12px;margin:0;
        border-radius:3px;
    }

    /* ── PLAYER PANEL ── */
    #playerPanel{
        display:flex;gap:16px;flex-wrap:wrap;
        background:var(--panel);border:1px solid var(--border);
        border-radius:6px;padding:8px 14px;margin-bottom:10px;
    }
    #playerPanel .stat-block .label{color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;}
    #playerPanel .stat-block .value{font-size:15px;font-weight:700;color:var(--gold);}

    /* ── GAME LAYOUT ── */
    #game{display:flex;gap:14px;align-items:flex-start;}

    /* ── SIDEBAR: full on wide screens ── */
    #companyList{
        width:230px;flex-shrink:0;
        display:flex;flex-direction:column;gap:5px;
    }
    .company-row{
        display:block;width:100%;text-align:left;
        background:var(--panel);border:1px solid var(--border);
        border-left:3px solid var(--border);border-radius:4px;
        padding:7px 9px;cursor:pointer;color:var(--text);
    }
    .company-row:hover{border-left-color:var(--gold);}
    .company-row.selected{border-left-color:var(--gold);background:var(--panel-alt);}
    .company-row.locked{opacity:.6;}
    .company-row.affordable{opacity:1;border-left-color:var(--green);}
    .company-row .row-name{
        font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
        display:flex;justify-content:space-between;
    }
    .can-buy-dot{color:var(--green);font-size:10px;}
    .company-row .row-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
    .progress-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
    .progress-fill{height:100%;background:var(--green);}

    /* ── SIDEBAR: emoji-only strip on small screens ── */
    #companyListEmoji{
        display:none;
        flex-direction:column;gap:4px;
        width:44px;flex-shrink:0;
    }
    .emoji-row{
        width:40px;height:40px;
        display:flex;align-items:center;justify-content:center;
        font-size:20px;border-radius:6px;cursor:pointer;
        border:2px solid var(--border);background:var(--panel);
        position:relative;
    }
    .emoji-row.selected{border-color:var(--gold);}
    .emoji-row.locked{opacity:.45;}
    .emoji-row.affordable{border-color:var(--green);}
    .emoji-row .emoji-dot{
        position:absolute;top:2px;right:2px;
        width:7px;height:7px;border-radius:50%;
        background:var(--green);
    }

    @media(max-width:680px){
        #companyList{display:none;}
        #companyListEmoji{display:flex;}
    }

    /* ── DETAIL PANEL ── */
    #companyDetails{
        flex:1;background:var(--panel);border:1px solid var(--border);
        border-radius:6px;padding:14px 18px;min-width:0;
    }
    #companyDetails h2{font-size:17px;}
    .locked-panel{padding:24px 10px;text-align:center;color:var(--text-dim);}
    .locked-panel .lock-icon{font-size:28px;margin-bottom:6px;}
    .locked-panel .progress-bar{max-width:260px;margin:10px auto;height:6px;}
    .section-label{
        text-transform:uppercase;letter-spacing:1px;font-size:11px;
        color:var(--text-dim);margin:6px 0 2px 0;
    }
    .upgrade-card{
        border:1px solid var(--border);border-radius:4px;
        padding:5px 8px;background:var(--panel-alt);margin-bottom:4px;
    }
    .upgrade-card button{width:100%;text-align:left;margin:4px 0 0 0;}
    .upgrade-desc{font-size:11px;color:var(--text-dim);margin-top:3px;}
    .owner-card{
        border:1px solid var(--border);border-radius:4px;
        padding:5px 8px;background:var(--panel-alt);margin-bottom:5px;
    }
    .owner-flavour{font-size:11px;color:var(--text-dim);margin-top:3px;font-style:italic;}
    .markup-row{display:flex;align-items:center;gap:6px;}
    .markup-row input[type="range"]{flex:1;}

    /* ── DEV TOOLS ── */
    #developerTools{margin-top:16px;padding-top:10px;border-top:1px dashed var(--border);}
    #developerTools h3{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;}
    .dev-group{margin-bottom:6px;}
    .dev-group .dev-label{color:var(--text-dim);font-size:11px;margin-right:4px;}
</style>
</head>

        <div id="companyListEmoji"></div>

    </div>

    <div id="developerTools">

</div><!-- /mainContent -->

function buildCompany(def) {
    let isLemonade = def.id === "lemonade";
    let startShares = isLemonade ? 25 : 0;
    return {
        id:def.id, name:def.name, emoji:def.emoji, factor:def.factor, tagline:def.tagline,
        baseMarketCap: Math.round(def.factor * 100000),
        totalShares:100, ownedShares:startShares, cash:0,
        productionCost:def.factor,
        demand: Math.round(15 * Math.sqrt(def.factor)),
        markup:2, dividendRate:1,
        owners: def.owners.map(o => ({
            ...o,
            remainingShares: o.shares,
            boughtOut: o.name === "You" && isLemonade
        })),
        upgrades: def.upgrades.map(u => ({...u, purchased:false})),
        upgradeIndex:0
    };
}

const companies = COMPANY_DEFS.map(buildCompany);
let selectedCompany = companies[0];

function isActive(c){ return c.ownedShares > 0; }

// ─────────────────────────────────────────────
//  SAVE / LOAD
// ─────────────────────────────────────────────
function saveGame() {
    let data = {
        player: { cash: player.cash, totalDividends: player.totalDividends },
        companies: companies.map(c => ({
            id: c.id,
            ownedShares: c.ownedShares,
            cash: c.cash,
            markup: c.markup,
            dividendRate: c.dividendRate,
            upgradeIndex: c.upgradeIndex,
            owners: c.owners.map(o => ({ name: o.name, remainingShares: o.remainingShares, boughtOut: o.boughtOut })),
            upgrades: c.upgrades.map(u => ({ purchased: u.purchased }))
        }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadGame() {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    try {
        let data = JSON.parse(raw);
        player.cash = data.player.cash || 0;
        player.totalDividends = data.player.totalDividends || 0;
        data.companies.forEach(saved => {
            let c = companies.find(x => x.id === saved.id);
            if (!c) return;
            c.ownedShares   = saved.ownedShares;
            c.cash          = saved.cash;
            c.markup        = saved.markup;
            c.dividendRate  = saved.dividendRate;
            c.upgradeIndex  = saved.upgradeIndex;
            saved.owners.forEach((so, i) => {
                if (c.owners[i]) {
                    c.owners[i].remainingShares = so.remainingShares;
                    c.owners[i].boughtOut       = so.boughtOut;
                }
            });
            saved.upgrades.forEach((su, i) => {
                if (c.upgrades[i]) c.upgrades[i].purchased = su.purchased;
            });
        });
        return true;
    } catch(e) {
        console.warn("Save load failed", e);
        return false;
    }
}

// ─────────────────────────────────────────────
//  CALCULATIONS
// ─────────────────────────────────────────────
function calcCompany(c) {
    let costMult=1, demandMult=1;
    c.upgrades.forEach(u => {
        if (!u.purchased) return;
        if (u.costMult)   costMult   *= u.costMult;
        if (u.demandMult) demandMult *= u.demandMult;
    });
    let cost = c.productionCost * costMult;
    let upgBought = c.upgrades.filter(u=>u.purchased).length;
    let elasticity = Math.max(0.4, 1.6 - upgBought * 0.08);
    let priceMod = Math.pow(1/c.markup, elasticity);
    let demand   = c.demand * demandMult * priceMod;
    let salePrice= c.productionCost * c.markup;
    let revenue  = salePrice * demand;
    let expenses = cost * demand;
    let profit   = revenue - expenses;
    return {cost, demand, salePrice, revenue, expenses, profit};
}

function calcMarketCap(c, stats) {
    let s = stats || calcCompany(c);
    return Math.max(c.baseMarketCap*0.5, c.baseMarketCap + Math.max(0,s.profit)*PE_MULTIPLIER);
}
function calcSharePrice(c, stats){ return calcMarketCap(c,stats)/c.totalShares; }
function calcShareValue(c, stats){ return (c.ownedShares/c.totalShares)*calcMarketCap(c,stats); }

function distributeProfit(c, amount) {
    let div = amount * c.dividendRate * (c.ownedShares/c.totalShares);
    player.cash += div; player.totalDividends += div;
    c.cash += amount - div;
    return div;
}

// ─────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────
let gameSpeed=1, loopId=null;

function tick() {
    let income=0;
    companies.forEach(c => {
        if (!isActive(c)) return;
        income += distributeProfit(c, calcCompany(c).profit);
    });
    player.income = income;
    saveGame();
}

let renderLoopId = null;
function startRenderLoop() {
    if (renderLoopId) clearInterval(renderLoopId);
    renderLoopId = setInterval(render, 250);
}

function startLoop() {
    if (loopId) clearInterval(loopId);
    loopId = setInterval(tick, 1000/gameSpeed);
}

function setGameSpeed(mult) {
    gameSpeed = mult; startLoop();
    document.querySelectorAll("[id^='speed-']").forEach(b => b.classList.remove("active-speed"));
    let btn = document.getElementById("speed-"+mult);
    if (btn) btn.classList.add("active-speed");
}

    localStorage.setItem("acTheme", isDark ? "dark" : "light");

        document.getElementById("themeToggle").textContent = "☀️ Light";
    }
}

function fmt(n) {
    n=n||0; let a=Math.abs(n);
    if(a>=1e12) return (n/1e12).toFixed(2)+"T";
    if(a>=1e9)  return (n/1e9).toFixed(2)+"B";
    if(a>=1e6)  return (n/1e6).toFixed(2)+"M";
    if(a>=1e3)  return (n/1e3).toFixed(2)+"K";
    return n.toFixed(2);
}

function gameLog(msg, isStory) {
    let box  = document.getElementById("consoleOutput");
    // Keep only last message visible in the slim bar
    box.innerHTML = "";
    let line = document.createElement("span");
    line.textContent = "> " + msg;
    if (isStory) line.classList.add("story-log");
    box.appendChild(line);
}

function renderList() {

        let nextOwner = c.owners.find(o=>!o.boughtOut);

        let canBuyOwner = active && nextOwner && player.cash >= ownerShareCost;

        row.className = "company-row"

            +(affordable?" affordable":"");

function doBuyFirstShare() {
    let c = selectedCompany;
    let price = calcSharePrice(c);
    if (player.cash < price) { gameLog("Not enough cash — need $"+fmt(price)); render(); return; }
    player.cash -= price;
    c.ownedShares += 1;
    let yo = c.owners.find(o=>o.name==="You");
    if (yo) { yo.boughtOut=true; yo.remainingShares=0; }
    gameLog(`First share in ${c.name} — $${fmt(price)}`, true);
    render();
}

// Buy exactly 1 share from a specific owner
function doBuyOneShare(ownerIndex) {
    let c = selectedCompany;
    let o = c.owners[ownerIndex];
    let price = calcSharePrice(c);
    if (player.cash < price) { gameLog("Not enough cash."); render(); return; }
    if (o.remainingShares <= 0) return;

    player.cash    -= price;
    c.ownedShares  += 1;
    o.remainingShares -= 1;

    if (o.remainingShares <= 0) {
        o.boughtOut = true;
        if (o.buyoutLine) gameLog(`${o.name}: ${o.buyoutLine}`, true);
        else gameLog(`${o.name} fully bought out.`, true);
        let allDone = c.owners.every(o2=>o2.boughtOut);
        if (allDone) gameLog(`You now own 100% of ${c.name}.`, true);
    } else {
        gameLog(`Bought 1 share from ${o.name} — $${fmt(price)}. ${o.remainingShares} left.`);
    }
    render();
}

// Buy all remaining shares from a specific owner
function doBuyAllShares(ownerIndex) {
    let c = selectedCompany;
    let o = c.owners[ownerIndex];
    let price = calcSharePrice(c);
    let total = Math.round(o.remainingShares * price);
    if (player.cash < total) { gameLog("Not enough cash — need $"+fmt(total)); render(); return; }

    player.cash   -= total;
    c.ownedShares += o.remainingShares;
    o.remainingShares = 0;
    o.boughtOut = true;

    if (o.buyoutLine) gameLog(`${o.name}: ${o.buyoutLine}`, true);
    else gameLog(`${o.name} fully bought out for $${fmt(total)}.`, true);
    let allDone = c.owners.every(o2=>o2.boughtOut);
    if (allDone) gameLog(`You now own 100% of ${c.name}.`, true);
    render();
}

function doBuyUpgrade() {
    let c = selectedCompany;
    while (c.upgradeIndex<c.upgrades.length && c.upgrades[c.upgradeIndex].purchased) c.upgradeIndex++;
    if (c.upgradeIndex>=c.upgrades.length) { gameLog("All upgrades done."); return; }
    let upg  = c.upgrades[c.upgradeIndex];
    let cost = Math.round(upg.cost*c.factor);
    if (c.cash<cost) { gameLog(`Need $${fmt(cost)} company cash. Have $${fmt(c.cash)}.`); return; }
    c.cash -= cost; upg.purchased=true; c.upgradeIndex++;
    gameLog(`${c.name}: "${upg.name}" — ${upg.desc}`, true);
    render();
}

function doSetMarkup(val) {
    selectedCompany.markup = Math.min(MARKUP_MAX,Math.max(MARKUP_MIN,Math.round(parseFloat(val))));
    render();
}
function doAdjustMarkup(delta) {
    selectedCompany.markup = Math.min(MARKUP_MAX,Math.max(MARKUP_MIN,Math.round(selectedCompany.markup)+delta));
    render();
}
function changeDividend(delta) {
    let c=selectedCompany;
    c.dividendRate=Math.min(1,Math.max(0,Math.round((c.dividendRate+delta)*100)/100));
    render();
}
function doHustle() {
    let c=selectedCompany;
    let amt=Math.max(1,calcCompany(c).profit*0.15);
    let div=distributeProfit(c,amt);
    gameLog(`Hustled $${fmt(amt)} at ${c.name}${div>0?` → $${fmt(div)} to you`:' → reinvested'}`);
    render();
}

function addCash(n){ player.cash+=n; gameLog("Dev: +$"+fmt(n)); render(); }

function devUnlockAll(){
    companies.forEach(c=>{
        if(!isActive(c)){
            c.ownedShares=1;
            let yo=c.owners.find(o=>o.name==="You");
            if(yo){yo.boughtOut=true;yo.remainingShares=0;}
        }
    });
    gameLog("Dev: unlocked all"); render();
}

function devMaxUpgrades(){
    let c=selectedCompany;
    c.upgrades.forEach(u=>u.purchased=true);
    c.upgradeIndex=c.upgrades.length;
    gameLog("Dev: maxed "+c.name); render();
}
