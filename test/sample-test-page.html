<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample test page</title>
<style>
  body{margin:0;background:#fafaf8;color:#414142;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;line-height:1.5;}
  .wrap{max-width:720px;margin:0 auto;padding:64px 24px;}
  .tag{display:inline-block;background:#e3e421;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;}
  h1{font-size:32px;margin:14px 0 8px;}
  p{color:#5c5c5e;}
</style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Test</span>
    <h1>Sample test page</h1>
    <p>If you can see this after signing in to the Test area, the preview setup is working. Test builds will appear in the same list.</p>
  </div>
</body>
</html>
