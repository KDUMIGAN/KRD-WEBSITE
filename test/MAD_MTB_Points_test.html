<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAD MTB Points test</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2256 53 508 508%22%3E%3Crect x=%2256.62%22 y=%2253.78%22 width=%22507.117%22 height=%22507.117%22 fill=%22%23E3E421%22/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header with plate-style mark + tab bar; one working panel per view; tables scroll inside their own frame. */
:root{
  --krd-grey:#414142; --krd-lime:#E3E421;
  --bg:#F3F3F2; --surface:#FFFFFF; --surface-2:#EEEEEC; --ink:#232325; --muted:#66666A; --line:#D9D9DB;
  --accent:#414142; --accent-ink:#E3E421; --accent-soft:#F4F4E0;
  --plate:#E3E421; --plate-ink:#232325; --gold:#E2B33C; --gold-soft:#F7E7B5; --dh:#F8C08F; --silver:#C9C9CC; --bronze:#D3A57A;
  --warn:#8A4B00; --warn-soft:#FBEBD6; --bad:#8A2A1E; --bad-soft:#F6E0DD;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:0px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--krd-grey)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--krd-grey);color:#fff}
header.top .logo{display:block;width:150px;height:auto}
header.top .apptitle{font-weight:700;font-size:18px;letter-spacing:.01em;padding-left:14px;border-left:1px solid #6a6a6b}
header.top label{color:#d6d6d8}
header.top select{background:#fff}
.hbtn{background:transparent;color:#fff;border:1px solid #8a8a8c;border-radius:0;padding:6px 12px;font-weight:600}
.hbtn:hover{border-color:var(--krd-lime)}
.hbtn.ghostd{border-color:transparent}
.unlock input{width:170px;border-radius:0}
.unlock label{color:#d6d6d8}
@media (max-width:600px){header.top .logo{width:110px}header.top .apptitle{font-size:15px}}
.bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:10px}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.plate{font-family:var(--display);font-weight:700;background:var(--plate);color:var(--plate-ink);border-radius:4px;padding:2px 8px 1px;font-size:20px;letter-spacing:.02em;line-height:1.2}
.mark h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em;white-space:nowrap}
.spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#cfcfd1;text-decoration:none;padding:8px 12px 6px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--krd-lime)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:20px 60px}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:.02em}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--muted)}
button.primary{background:var(--krd-grey);color:#fff;border-color:var(--krd-grey);box-shadow:inset 0 -3px 0 var(--krd-lime)}
button.danger{color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;padding:4px 8px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0}
textarea{width:100%;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:500}
label.f > input,label.f > select{color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:0;padding:5px 12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--krd-grey);color:var(--krd-lime);border-color:var(--krd-grey)}
.chip.ov[aria-pressed="false"]{border-color:var(--krd-grey);color:var(--krd-grey);font-weight:700}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
thead tr.series th{background:var(--surface);font-weight:700;text-transform:uppercase;color:var(--ink);font-family:var(--display);font-size:12px;letter-spacing:.04em;border-bottom:none;padding-bottom:0}
td.c,th.c{text-align:center}
td.sub,th.sub{background:var(--surface-2);font-weight:600}
td.tot,th.tot{font-weight:700;font-size:16px}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:none}
.pos{display:inline-grid;place-items:center;min-width:28px;height:24px;border-radius:4px;font-family:var(--display);font-weight:700;font-size:16px;padding:0 4px}
.p1{background:var(--gold);color:var(--plate-ink)} .p2{background:var(--silver);color:var(--plate-ink)} .p3{background:var(--bronze);color:var(--plate-ink)}
.cell-pos{font-size:11px;color:var(--muted);margin-left:3px}
td.dh{background:var(--dh)}
.subtop{background:var(--gold);color:var(--plate-ink);font-weight:700;padding:0 3px}
tbody tr:hover td.dh{background:var(--dh)}
td.top,tbody tr:hover td.top{background:var(--gold-soft);font-weight:700}
.dropped{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:1px 5px;background:var(--surface-2);color:var(--muted)}
.tag.bonus{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.notice{border-left:3px solid var(--plate);background:var(--surface);padding:10px 12px;border-radius:0 var(--r) var(--r) 0}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.notice.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.grid2{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.rlist{display:flex;flex-direction:column;gap:12px}
.rlist .ser{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.rbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font-weight:600;border-radius:4px;padding:7px 10px;margin-bottom:3px}
.rbtn[aria-pressed="true"]{border-color:var(--krd-grey);box-shadow:inset 4px 0 0 var(--krd-lime)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.block.skip{opacity:.55}
.block ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.block li{display:flex;gap:8px;align-items:center;min-width:0}
.block li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:3;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.ed td{padding:3px 4px}
.ed input{width:100%}
.ed input.w-xs{width:52px}.ed input.w-s{width:76px}.ed input.w-m{width:96px}.ed input.w-l{min-width:180px}
.flag{color:var(--warn);cursor:help;font-weight:700}
details summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gradechecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;padding:8px 0}
.gradechecks label{display:flex;gap:6px;align-items:center;justify-content:flex-start;text-align:left;font-size:14px}
.gradechecks input[type=checkbox],.ed .gradechecks input[type=checkbox]{width:auto;flex:none;margin:0}
.gradeall{padding-top:6px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:var(--r);font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.hist ol{margin:6px 0 0;padding-left:22px}
.sortable{cursor:pointer}
.expgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.expgrid figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.expgrid img{width:100%;height:auto;border:1px solid var(--line);background:#fff}
.expand td{background:var(--surface-2);white-space:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===== Points engine (pure) ===== */
const ENG = (() => {
  const normName = s => String(s || '').replace(/\s+/g, ' ').trim().toUpperCase();

  function parseTime(s) {
    s = String(s == null ? '' : s).trim();
    if (!s || !/^\d+(:\d+){0,2}(\.\d+)?$/.test(s)) return null;
    const p = s.split(':').map(Number);
    let t = 0; for (const x of p) t = t * 60 + x;
    return t;
  }
  function fmtTime(t) {
    if (t == null || isNaN(t)) return '';
    t = Math.round(t);
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const mm = String(m).padStart(h ? 2 : 1, '0'), ss = String(s).padStart(2, '0');
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function allRounds(season) {
    const out = [];
    (season.series || []).forEach(s => (s.rounds || []).forEach(r => out.push({ ...r, seriesId: s.id })));
    return out;
  }

function body() {
  if (S.view === 'stats') return viewStats();
  if (S.loading && !Object.keys(S.seasons).length) return `<div class="empty">${S.offline ? 'The saved data can\'t be reached yet. Check your connection; this page keeps trying.' : 'Loading the championship…'}</div>`;
  if (S.error) return `<div class="notice bad">Couldn't load the data: ${esc(S.error)}</div>`;
  if (!S.db) return `<div class="notice bad">${SITE ? 'The points data can\'t be reached right now. Check your connection and reload the page.' : 'Saved data isn\'t available in this view. Open the page while signed in to claude.ai.'}</div>`;
  if (SITE && !S.canWrite && (S.view === 'rounds' || S.view === 'import' || S.view === 'setup')) return S.db && !S.db.checkPassword ? `<div class="empty">This copy is view-only. Standings and Stats are available.</div>` : `<div class="empty">Use the Edit button at the top and enter the editor password to ${S.view === 'import' ? 'import results' : S.view === 'rounds' ? 'see and edit round results' : 'change the season setup'}.</div>`;
  if (!season()) return S.view === 'setup' ? viewNewSeason(true) : `<div class="empty"><p>No season set up yet.</p><p><a href="#setup">Set up the first season</a></p></div>`;
  const ro = !S.canWrite && S.view !== 'standings' ? `<div class="notice small" style="margin-bottom:12px">${SITE ? 'Viewing only. Use Edit at the top to unlock changes.' : 'You have view-only access. Changes can\'t be saved.'}</div>` : '';
  return ro + ({ standings: viewStandings, rounds: viewRounds, import: viewImport, setup: viewSetup }[S.view])();
}

function editControl() {
  if (S.canWrite) return `<button class="hbtn" data-act="lock">Lock editing</button>`;
  if (!S.ui.unlock) return `<button class="hbtn" data-act="editOpen">Edit</button>`;
  return `<span class="row unlock"><label for="editPass" class="small">Editor password</label><input id="editPass" type="password" autocomplete="current-password"><button class="hbtn" data-act="unlock" ${S.checking ? 'disabled' : ''}>${S.checking ? 'Checking…' : 'Unlock'}</button><button class="hbtn ghostd" data-act="editCancel">Cancel</button></span>`;
}
async function unlockEditing() {
  const el = document.getElementById('editPass'); const pass = el ? el.value : '';
  if (!pass) return toast('Enter the editor password.');
  S.checking = true; render();
  let ok = false;
  try { ok = await S.db.checkPassword(pass); } catch (e) { S.checking = false; render(); return toast('Couldn\'t check the password. Try again.'); }
  S.checking = false;
  if (!ok) { render(); const f = document.getElementById('editPass'); if (f) f.focus(); return toast('That password isn\'t right.'); }
  EDIT.pass = pass; try { sessionStorage.setItem('mad.edit', pass); } catch (e) {}
  S.canWrite = true; S.ui.unlock = false; toast('Editing unlocked'); render();
}
function lockEditing() {
  EDIT.pass = null; try { sessionStorage.removeItem('mad.edit'); } catch (e) {}
  S.canWrite = false; S.ui.unlock = false;
  if (S.view === 'rounds' || S.view === 'import' || S.view === 'setup') location.hash = 'standings';
  render();
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'editPass') { e.preventDefault(); unlockEditing(); } });

/* ---------- Standings ---------- */
function viewStandings() {
  const se = season(); const races = racesFor(S.year); const scored = ENG.scoreAll(se, races);
  const sel = S.ui.table;
  const chips = (se.overalls || []).map(t => `<button class="chip ov" aria-pressed="${sel === 'o:' + t.id}" data-act="table" data-v="o:${t.id}">${esc(t.name)}</button>`).join('')
    + `<span style="width:8px"></span>` + `<button class="chip" aria-pressed="${sel === 'g:*'}" data-act="table" data-v="g:*">All grades</button>`
    + (se.grades || []).map(g => `<button class="chip" aria-pressed="${sel === 'g:' + g.id}" data-act="table" data-v="g:${g.id}">${esc(g.name)}</button>`).join('');
  const serSel = `<label class="row small muted" for="serSel">Show <select id="serSel" data-act="series"><option value="">Whole season</option>${(se.series || []).map(s => `<option value="${s.id}" ${S.ui.series === s.id ? 'selected' : ''}>${esc(s.name)} series</option>`).join('')}</select></label>`;
  let tables = '';
  const [kind, key] = sel.split(':');
  if (kind === 'o') { const t = (se.overalls || []).find(t => t.id === key) || (se.overalls || [])[0]; if (t) tables = standingsTable(se, scored, 'overall', t.id, t.name); }
  else if (key === '*') tables = (se.grades || []).map(g => standingsTable(se, scored, 'graded', g.id, g.name, true)).join('');
  else tables = standingsTable(se, scored, 'graded', key, gradeName(key));
  const doneN = ENG.allRounds(se).filter(r => scored[r.id] && scored[r.id].has).length, allN = ENG.allRounds(se).length;
  const dropTxt = se.drop && Number(se.drop.count) ? ` Worst ${se.drop.count} round${se.drop.count > 1 ? 's' : ''} dropped per ${se.drop.scope === 'series' ? 'series' : 'season'}.` : '';
  return `<div class="stack">
    <div><h2>${esc(se.name || S.year + ' Championship')}</h2><p class="lede">${doneN} of ${allN} rounds scored. Ties are split on most 1sts, then 2nds, and so on.${dropTxt}</p></div>
    <div class="chips" role="group" aria-label="Table">${chips}</div>
    <div class="row">${serSel}<span class="spacer"></span><button data-act="exportXlsx" ${S.xlsxing ? 'disabled' : ''}>${S.xlsxing ? 'Making Excel…' : 'Export Excel'}</button><button data-act="exportImgs" ${S.exporting ? 'disabled' : ''}>${S.exporting ? 'Making images…' : 'Export images'}</button></div>
    ${exportPanel()}
    ${tables}</div>`;
}
function standingsTable(se, scored, kind, key, title, compact) {
  const st = ENG.standings(se, scored, kind, key, { seriesId: S.ui.series || null });
  if (compact && !st.rows.length) return '';
  const series = (se.series || []).filter(s => st.rounds.some(r => r.seriesId === s.id));
  let h1 = '<tr class="series"><th colspan="5"></th>', h2 = '<tr><th class="c">Pos</th><th>Rider</th><th class="c tot">Pts</th><th class="c">Gap ahead</th><th class="c">Gap to 1st</th>';
  for (const s of series) {
    const rs = st.rounds.filter(r => r.seriesId === s.id);
    h1 += `<th colspan="${rs.length + 1}" class="c">${esc(s.name)}</th>`;
    h2 += rs.map(r => `<th class="c">${esc(r.name)}</th>`).join('') + `<th class="c sub">Total</th>`;
  }
  h1 += '</tr>'; h2 += '</tr>';
  const lead = st.rows[0];
  const rows = st.rows.map((rw, ri) => {
    const prev = st.rows[ri - 1];
    const gap = (a, b) => a && a !== rw ? (a.total - rw.total ? '−' + (a.total - rw.total) : '0') : '';
    let t = `<tr><td class="c"><span class="pos ${rw.place <= 3 ? 'p' + rw.place : ''}">${rw.place}</span></td><td><strong>${esc(rw.name)}</strong>${rw.tieBroken ? ` <span class="tag" title="Level on points. Placed on count back: most 1sts, then 2nds, and so on.">count back</span>` : ''}</td><td class="c tot">${rw.total}</td><td class="c muted">${gap(prev)}</td><td class="c muted">${gap(lead)}</td>`;
    for (const s of series) {
      for (const r of st.rounds.filter(r => r.seriesId === s.id)) {
        const c = rw.cells[r.id];
        if (!c) { t += `<td class="c muted">${scored[r.id] && scored[r.id].has ? '·' : ''}</td>`; continue; }
        const lab = c.status === 'DNF' || c.status === 'DNS' ? `<span class="cell-pos">${c.status}</span>` : c.pos ? `<span class="cell-pos">${ord(c.pos)}</span>` : '';
        const tip = [c.status === 'MISS' ? 'Missed round (dropped)' : '', ...(c.notes || []), c.dropped ? 'Dropped round' : ''].filter(Boolean).join(' · ');
        const dhc = (c.notes || []).some(n => /downhill/i.test(n));
        t += `<td class="c ${c.dropped ? 'dropped' : ''} ${dhc ? 'dh' : ''}" ${tip ? `title="${esc(tip)}"` : ''}>${c.status === 'MISS' ? '0' : c.pts}${lab}${(c.notes || []).some(n => !/downhill/i.test(n)) ? ' <span class="tag bonus">+</span>' : ''}</td>`;
      }
      t += `<td class="c sub">${rw.series[s.id] || 0}</td>`;
    }
    return t + '</tr>';
  }).join('');
  return `<section class="stack" style="gap:8px"><h3>${esc(title)}</h3>${st.rows.length ? `<div class="tablebox"><table><thead>${h1}${h2}</thead><tbody>${rows}</tbody></table></div>` : `<div class="panel empty">No points yet. Import results on the <a href="#import">Import</a> tab.</div>`}</section>`;
}

function exportPanel() {
  if (!S.exp) return '';
  const se = season();

    <details><summary class="small">Or paste the CSV text</summary><textarea id="impText" rows="6" placeholder='"Rank";"Name";"L";…'></textarea><div style="margin-top:6px"><button data-act="impPaste">Read pasted text</button></div></details></div>

function guessGrades(blocks) {
  const se = season(); const known = knownRiders(S.year);
  const round = ENG.allRounds(se).find(r => r.id === S.ui.importRound);
  const order = (se.grades || []).filter(g => ENG.eligible(round, g.id)).map(g => g.id);
  const taken = new Set();
  blocks.forEach(b => {
    if (b.label) { const g = (se.grades || []).find(g => g.name.toLowerCase() === b.label.toLowerCase()); if (g) { b.grade = g.id; taken.add(g.id); return; } }
    const votes = {}; b.rows.forEach(r => { const g = known.get(r.name); if (g) votes[g] = (votes[g] || 0) + 1; });
    const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
    if (best && order.includes(best[0]) && !taken.has(best[0])) { b.grade = best[0]; taken.add(best[0]); }
  });
  let oi = 0;
  blocks.forEach(b => { if (b.grade) { oi = Math.max(oi, order.indexOf(b.grade) + 1); return; } while (oi < order.length && taken.has(order[oi])) oi++; if (oi < order.length) { b.grade = order[oi]; taken.add(order[oi]); oi++; } else b.grade = ''; });
  return blocks;
}
function loadCSV(text) {
  try { S.ui.blocks = guessGrades(ENG.parseResults(text)); }
  catch (e) { S.ui.blocks = null; toast(e.message); }
  render();

/* ---------- Stats ---------- */
function computeStats() {
  const B = S.baseline || { updated: '', years: [], riders: [], results: [] };
  const cut = B.updated || '';
  const cutYear = cut ? Number(cut.slice(0, 4)) : 0;
  const after = (se, rounds) => { const last = rounds.map(r => r.date).filter(Boolean).sort().pop(); return last ? last > cut : se.year > cutYear; };
  const riders = new Map();
  const R = n => { n = canon(n); if (!riders.has(n)) riders.set(n, { n, races: 0, r: {}, s: {} }); return riders.get(n); };
  B.riders.forEach(x => riders.set(x.n, clone(x)));
  const bump = (rec, sec, pos, grp) => {
    const add = k => { rec[sec][k] = rec[sec][k] || {}; rec[sec][k][grp] = (rec[sec][k][grp] || 0) + 1; };
    if (pos === 1) add('W'); if (pos <= 3) add('P'); if (pos <= 5) add('T5'); if (pos <= 10) add('T10');
  };
  const yearsApp = []; const resultsApp = [];
  const baseYears = new Set(B.years.map(y => y.year));
  for (const se of Object.values(S.seasons).sort((a, b) => a.year - b.year)) {
    const races = racesFor(se.year); const sc = ENG.scoreAll(se, races);
    const grp = gid => ((se.grades || []).find(g => g.id === gid) || {}).group || 'Other';
    const rounds = ENG.allRounds(se);
    const yr = { year: se.year, races: 0, types: {}, sets: {}, app: true };
    for (const r of rounds) {
      const s = sc[r.id]; if (!s || !s.has) continue;
      const grpKey = r.raceGroup ? 'g:' + r.raceGroup : r.id;
      if (!yr.seen) yr.seen = new Set();
      if (!yr.seen.has(grpKey)) { yr.seen.add(grpKey); yr.races++; yr.types[r.type || 'XCO'] = (yr.types[r.type || 'XCO'] || 0) + 1; }
      const counted = after(se, [r]);
      const seen = new Set();
      for (const [gid, map] of Object.entries(s.graded)) {
        const g = (se.grades || []).find(x => x.id === gid) || {};
        for (const [n, c] of Object.entries(map)) {
          if (c.status === 'DNS' || c.status === 'B') continue;
          const k = (g.junior ? 'J' : 'S') + '|' + (g.group || '') + '|' + (g.gender || '');
          (yr.sets[k] = yr.sets[k] || new Set()).add(canon(n));
          if (!counted) continue;
          const rec = R(n);
          const rk = (r.raceGroup ? 'g:' + r.raceGroup : r.id) + '|' + rec.n;
          if (!seen.has(rk) && !(yr.riderRaces = yr.riderRaces || new Set()).has(rk)) { rec.races++; seen.add(rk); yr.riderRaces.add(rk); }
          if (c.pos) bump(rec, 'r', c.pos, grp(gid));
        }
      }
    }
    if (!baseYears.has(se.year) && yr.races) yearsApp.push(yr);
    for (const ser of se.series || []) {
      const rs = ser.rounds || []; if (!rs.length) continue;
      if (!rs.every(r => sc[r.id] && sc[r.id].has) || !after(se, rs)) continue;
      for (const t of se.overalls || []) ENG.standings(se, sc, 'overall', t.id, { seriesId: ser.id }).rows.forEach(rw => bump(R(rw.name), 's', rw.place, 'Overall'));
      for (const g of se.grades || []) ENG.standings(se, sc, 'graded', g.id, { seriesId: ser.id }).rows.forEach(rw => bump(R(rw.name), 's', rw.place, g.group));
    }
    // only the newest season can be in progress; older seasons are finished even if some rounds never ran
    const newest = Math.max(...Object.keys(S.seasons).map(Number));
    const complete = se.year < newest || (rounds.length && rounds.every(r => sc[r.id] && sc[r.id].has));
    const lists = [];
    for (const t of se.overalls || []) lists.push({ table: t.name, top: ENG.standings(se, sc, 'overall', t.id).rows.slice(0, 10).map(r => r.name) });
    for (const g of se.grades || []) lists.push({ table: g.name, top: ENG.standings(se, sc, 'graded', g.id).rows.slice(0, 10).map(r => r.name) });
    lists.filter(l => l.top.length).forEach(l => resultsApp.push({ year: se.year, table: l.table, top: l.top, live: !complete }));
  }
  // summarise app years into baseline shape
  const yearsOut = B.years.map(y => ({ ...y })).concat(yearsApp.map(y => {
    const tm = (pred) => { const all = new Set(), m = new Set(), f = new Set(); for (const [k, set] of Object.entries(y.sets)) { const [j, g, sx] = k.split('|'); if (!pred(j, g)) continue; set.forEach(n => { all.add(n); if (sx === 'M') m.add(n); if (sx === 'F') f.add(n); }); } return [all.size, m.size, f.size]; };
    return { year: y.year, races: y.races, types: y.types, seniors: tm(j => j === 'S'), juniors: tm(j => j === 'J'), groups: Object.fromEntries(GROUPS.map(g => [g, tm((j, gg) => gg === g)])), app: true };
  })).sort((a, b) => b.year - a.year);
  const tot = (o) => Object.values(o || {}).reduce((a, b) => a + b, 0);
  const list = [...riders.values()].map(x => ({ ...x, W: tot((x.r || {}).W), P: tot((x.r || {}).P), T5: tot((x.r || {}).T5), T10: tot((x.r || {}).T10), SW: tot((x.s || {}).W), SP: tot((x.s || {}).P) }));
  return { cut, years: yearsOut, riders: list, results: B.results.map(r => ({ ...r })).concat(resultsApp) };
}
function viewStats() {
  if (S.loading && !S.baseline && !Object.keys(S.seasons).length) return `<div class="empty">${S.offline ? 'The saved data can\'t be reached yet.' : 'Loading stats…'}</div>`;
  const st = computeStats();
  const types = ['XCO', 'XCM', 'XCEN', 'Enduro', 'DH', 'XCE'];
  let best = {};
  const trio = (a, k) => a && a[0] ? `${a[0]}<span class="cell-pos"><span class="${a[1] > 0 && best[k + 'm'] === a[1] ? 'subtop' : ''}">${a[1]}M</span> <span class="${a[2] > 0 && best[k + 'f'] === a[2] ? 'subtop' : ''}">${a[2]}F</span></span>` : '<span class="muted">–</span>';
  best = {}; const bump = (k, v) => { if (v > 0 && v > (best[k] || 0)) best[k] = v; };
  st.years.forEach(y => { bump('races', y.races); types.forEach(t => bump(t, (y.types || {})[t] || 0)); const tri = (k, a) => { a = a || []; bump(k, a[0] || 0); bump(k + 'm', a[1] || 0); bump(k + 'f', a[2] || 0); }; tri('S', y.seniors); tri('J', y.juniors); GROUPS.forEach(g => tri(g, (y.groups || {})[g])); });
  const top = (k, v) => v > 0 && best[k] === v ? ' top' : '';
  const yRows = st.years.map(y => `<tr><td><strong>${y.year}</strong></td><td class="c tot${top('races', y.races)}">${y.races}</td>${types.map(t => `<td class="c${top(t, (y.types || {})[t] || 0)}">${(y.types || {})[t] || '<span class="muted">–</span>'}</td>`).join('')}<td class="c sub${top('S', (y.seniors || [])[0] || 0)}">${trio(y.seniors, 'S')}</td><td class="c sub${top('J', (y.juniors || [])[0] || 0)}">${trio(y.juniors, 'J')}</td>${GROUPS.map(g => `<td class="c${top(g, ((y.groups || {})[g] || [])[0] || 0)}">${trio((y.groups || {})[g], g)}</td>`).join('')}</tr>`).join('');
  const q = S.ui.statQ.trim().toUpperCase();
  const sortKey = S.ui.statSort;
  const rs = st.riders.filter(r => !q || r.n.includes(q)).sort((a, b) => sortKey === 'n' ? a.n.localeCompare(b.n) : (b[sortKey] || 0) - (a[sortKey] || 0) || a.n.localeCompare(b.n));
  const cols = [['n', 'Rider'], ['races', 'Races'], ['W', 'Wins'], ['P', 'Podiums'], ['T5', 'Top 5s'], ['T10', 'Top 10s'], ['SW', 'Series wins'], ['SP', 'Series podiums']];
  const th = cols.map(([k, l]) => `<th class="${k === 'n' ? '' : 'c'} sortable" data-act="statSort" data-v="${k}" aria-sort="${sortKey === k ? 'descending' : 'none'}">${l}${sortKey === k ? ' ▾' : ''}</th>`).join('');
  const brk = (sec, r) => { const ks = ['W', 'P', 'T5', 'T10']; const gs = [...new Set(ks.flatMap(k => Object.keys((r[sec] || {})[k] || {})))]; if (!gs.length) return '<span class="muted">None yet</span>'; return `<table><thead><tr><th>Group</th><th class="c">Wins</th><th class="c">Podiums</th><th class="c">Top 5s</th><th class="c">Top 10s</th></tr></thead><tbody>${gs.map(g => `<tr><td>${esc(g)}</td>${ks.map(k => `<td class="c">${((r[sec] || {})[k] || {})[g] || 0}</td>`).join('')}</tr>`).join('')}</tbody></table>`; };
  const rRows = rs.slice(0, 400).map(r => `<tr class="sortable" data-act="statOpen" data-v="${esc(r.n)}"><td><strong>${esc(r.n)}</strong></td><td class="c">${r.races}</td><td class="c">${r.W}</td><td class="c">${r.P}</td><td class="c">${r.T5}</td><td class="c">${r.T10}</td><td class="c">${r.SW}</td><td class="c">${r.SP}</td></tr>` +
    (S.ui.statOpen === r.n ? `<tr class="expand"><td colspan="8"><div class="row" style="align-items:flex-start;gap:24px"><div><h4>Race results</h4>${brk('r', r)}</div><div><h4>Series results</h4>${brk('s', r)}</div></div></td></tr>` : '')).join('');
  const hy = [...new Set(st.results.map(r => r.year))].sort((a, b) => b - a);
  const hYear = hy.includes(S.ui.histYear) ? S.ui.histYear : hy[0];
  const hist = st.results.filter(r => r.year === hYear).map(r => `<div class="panel"><h3>${esc(r.table)}${r.live ? ' <span class="tag warn">in progress</span>' : ''}</h3><ol class="num">${r.top.map(n => `<li>${esc(n)}</li>`).join('')}</ol></div>`).join('');
  return `<div class="stack">
    <div><h2>Club stats</h2><p class="lede">Counted from every season on this page${st.years.length ? ', ' + Math.min(...st.years.map(y => y.year)) + ' onward' : ''}. Placings for carried-over rounds come from each round's points. Importing results updates these automatically.</p></div>
    <section class="stack" style="gap:8px"><h3>Seasons</h3><div class="tablebox"><table><thead><tr><th>Year</th><th class="c">Races</th>${types.map(t => `<th class="c">${t}</th>`).join('')}<th class="c sub">Seniors</th><th class="c sub">Juniors</th>${GROUPS.map(g => `<th class="c">${esc(g)}</th>`).join('')}</tr></thead><tbody>${yRows || '<tr><td colspan="20" class="empty">No seasons yet</td></tr>'}</tbody></table></div><p class="small muted">Rider counts are unique riders, with men and women shown small. The biggest year in each column is shaded gold, and the biggest men's and women's numbers are marked in gold too.</p></section>
    <section class="stack" style="gap:8px"><div class="row"><h3>Riders</h3><span class="small muted">${st.riders.length} riders. Select a rider to see results by grade.</span><span class="spacer"></span><input id="statQ" type="search" placeholder="Find a rider" value="${esc(S.ui.statQ)}" data-act="statQ" aria-label="Find a rider"></div>
      <div class="tablebox" style="max-height:620px"><table><thead><tr>${th}</tr></thead><tbody>${rRows || '<tr><td colspan="8" class="empty">No riders match</td></tr>'}</tbody></table></div></section>
    <section class="stack" style="gap:8px"><div class="row"><h3>Final results by year</h3><span class="spacer"></span>${hy.length ? `<select id="histYear" data-act="histYear" aria-label="Year">${hy.map(y => `<option ${y === hYear ? 'selected' : ''}>${y}</option>`).join('')}</select>` : ''}</div>
      ${hist ? `<div class="hist">${hist}</div>` : '<div class="panel empty">No results yet.</div>'}</section></div>`;
}

/* ---------- path helpers ---------- */
function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (o[k] == null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; }
  o[ks[ks.length - 1]] = val;
}
function readVal(el) {
  const t = el.dataset.t;
  if (t === 'bool') return el.checked;
  if (t === 'num') return el.value === '' ? null : Number(el.value);
  if (t === 'time') return ENG.parseTime(el.value);
  if (t === 'name') return ENG.normName(el.value);
  if (t === 'list') return el.value.split(/[\s,;]+/).filter(Boolean).map(Number).filter(n => !isNaN(n));
  return el.value;
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'statQ') { S.ui.statQ = el.value; render(); return; }
  if (el.dataset.k && S.draft && el.type !== 'checkbox' && el.tagName !== 'SELECT') { setPath(S.draft, el.dataset.k, readVal(el)); S.dirty = true; markDirty(); }
  if (el.dataset.s && S.setup && el.type !== 'checkbox' && el.tagName !== 'SELECT') { setPath(S.setup, el.dataset.s, readVal(el)); S.setupDirty = true; markDirty(); }
});
function markDirty() { document.querySelectorAll('.savebar button.primary').forEach(b => { b.disabled = !S.canWrite || S.saving; }); document.querySelectorAll('.savebar button[data-act^="discard"]').forEach(b => b.disabled = false); const t = document.querySelector('.savebar > :first-child'); if (t) { t.className = 'tag warn'; t.textContent = 'unsaved changes'; } }
document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act;
  if (a === 'year') { S.exp = null; S.year = Number(el.value); S.draftKey = null; S.setup = null; S.ui.blocks = null; try { localStorage.setItem('mad.year', S.year); } catch (x) {} return render(); }
  if (a === 'series') { S.ui.series = el.value; return render(); }
  if (a === 'impRound') { S.ui.importRound = el.value; return render(); }
  if (a === 'impReplace') { S.ui.replace = el.checked; return; }
  if (a === 'blkGrade') { S.ui.blocks[Number(el.dataset.i)].grade = el.value; return render(); }
  if (a === 'histYear') { S.ui.histYear = Number(el.value); return render(); }
  if (a === 'impFile') { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => loadCSV(String(rd.result)); rd.readAsText(f); return; }
  if (a === 'downhillOv') { S.draft.downhillOverall = { ...(S.draft.downhillOverall || {}), [el.dataset.t]: el.value }; S.dirty = true; return render(); }
  if (a === 'downhill') { S.draft.downhill[el.dataset.g] = el.value; S.dirty = true; return render(); }
  if (a === 'legacy') { const L = S.draft.legacy[el.dataset.b][el.dataset.key]; L[el.dataset.n] = Number(el.value) || 0; S.dirty = true; return render(); }
  if (a === 'tier') { const t = S.setup.overalls[Number(el.dataset.t)]; t.tiers = t.tiers || {}; if (el.value === '') delete t.tiers[el.dataset.g]; else t.tiers[el.dataset.g] = Number(el.value); S.setupDirty = true; return render(); }
  if (a === 'rgrade') {
    const r = S.setup.series[el.dataset.si].rounds[el.dataset.ri];
    let gs = r.grades && r.grades.length ? r.grades.filter(id => S.setup.grades.some(g => g.id === id)) : S.setup.grades.map(g => g.id);
    gs = el.checked ? [...new Set([...gs, el.dataset.g])] : gs.filter(g => g !== el.dataset.g);
    r.grades = gs.length === S.setup.grades.length ? [] : gs.length ? gs : ['none']; S.setupDirty = true; return render();
  }
  if (a === 'customPts') { const r = S.setup.series[el.dataset.si].rounds[el.dataset.ri]; r.points = el.checked ? { overall: S.setup.points.overall.slice(), graded: S.setup.points.graded.slice() } : null; S.setupDirty = true; return render(); }
  if (el.dataset.k && S.draft) {
    setPath(S.draft, el.dataset.k, readVal(el)); S.dirty = true;
    if (/\.status$/.test(el.dataset.k) && el.value === 'F') { const i = Number(el.dataset.k.split('.')[1]); const en = S.draft.entries[i]; if (!en.pos) en.pos = S.draft.entries.filter(x => x.grade === en.grade && x.status === 'F').length; }
    return render();
  }
  if (el.dataset.s && S.setup) { setPath(S.setup, el.dataset.s, readVal(el)); S.setupDirty = true; return render(); }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const a = el.dataset.act; const se = season();
  const guard = () => { if ((S.view === 'rounds' && S.dirty) || (S.view === 'setup' && S.setupDirty)) { toast('Save or discard your changes first.'); return true; } return false; };
  switch (a) {
    case 'table': S.ui.table = el.dataset.v; return render();
    case 'editOpen': S.ui.unlock = true; render(); { const f = document.getElementById('editPass'); if (f) f.focus(); } return;
    case 'editCancel': S.ui.unlock = false; return render();
    case 'unlock': return unlockEditing();
    case 'lock': if ((S.view === 'rounds' && S.dirty) || (S.view === 'setup' && S.setupDirty)) return toast('Save or discard your changes first.'); return lockEditing();
    case 'exportImgs': return exportImages();
    case 'exportXlsx': return exportExcel();
    case 'closeExp': S.exp = null; return render();
    case 'saveImg': return saveImg(Number(el.dataset.i));
    case 'saveAllImg': return saveAllImg();
    case 'round': if (el.dataset.v !== S.ui.round && guard()) return; S.ui.round = el.dataset.v; S.draftKey = null; return render();
    case 'importHere': S.ui.importRound = S.ui.round; return;
    case 'addEntry': { const g = el.dataset.g; const n = S.draft.entries.filter(x => x.grade === g && x.status === 'F').length; S.draft.entries.push({ id: uid('e'), name: '', bib: '', grade: g, laps: null, time: null, status: 'F', pos: n + 1 }); S.dirty = true; render(); const last = document.getElementById('e' + (S.draft.entries.length - 1) + 'name'); if (last) last.focus(); return; }
    case 'delEntry': S.draft.entries.splice(Number(el.dataset.i), 1); S.dirty = true; return render();
    case 'resort': { const r = ENG.allRounds(se).find(r => r.id === S.ui.round); S.draft.entries = ENG.resort(S.draft.entries, r.format); S.dirty = true; return render(); }
    case 'addBonus': S.draft.bonus.push({ id: uid('b'), name: '', grade: (se.grades[0] || {}).id, pts: se.points.bonus || 3, applies: 'both', note: '' }); S.dirty = true; return render();
    case 'delBonus': S.draft.bonus.splice(Number(el.dataset.i), 1); S.dirty = true; return render();
    case 'dropLegacy': S.draft.legacy = null; S.dirty = true; return render();
    case 'discard': S.draftKey = null; S.dirty = false; return render();
    case 'saveRound': {
      const d = clone(S.draft); d.entries = d.entries.filter(x => x.name); d.bonus = d.bonus.filter(x => x.name); d.updatedAt = new Date().toISOString();
      if (await write('races/' + S.draftKey, d)) { S.dirty = false; S.draftKey = null; toast('Round saved'); render(); }
      return;
    }
    case 'impPaste': { const t = ($('#impText') || {}).value || ''; if (!t.trim()) return toast('Paste the CSV text first.'); return loadCSV(t); }
    case 'clearImport': S.ui.blocks = null; return render();
    case 'commitImport': return commitImport();
    case 'statSort': S.ui.statSort = el.dataset.v; return render();
    case 'statOpen': S.ui.statOpen = S.ui.statOpen === el.dataset.v ? null : el.dataset.v; return render();
    case 'newSeason': if (guard()) return; return newSeason();
    case 'addGrade': S.setup.grades.push({ id: uid('g'), name: 'New grade', group: 'A Grade', gender: 'M', junior: false }); S.setupDirty = true; return render();
    case 'delGrade': {
      const g = S.setup.grades[Number(el.dataset.i)];
      const used = Object.values(racesFor(S.year)).some(r => (r.entries || []).some(x => x.grade === g.id) || (r.legacy && r.legacy.graded && r.legacy.graded[g.id]));
      if (used && el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Remove? Has results'; return; }
      S.setup.grades.splice(Number(el.dataset.i), 1); S.setup.overalls.forEach(t => { if (t.tiers) delete t.tiers[g.id]; }); S.setupDirty = true; return render();
    }
    case 'mvGrade': { const i = Number(el.dataset.i), j = i + Number(el.dataset.d), A = S.setup.grades; if (j < 0 || j >= A.length) return; [A[i], A[j]] = [A[j], A[i]]; S.setupDirty = true; return render(); }
    case 'addOverall': S.setup.overalls.push({ id: uid('t'), name: 'New overall', tiers: {} }); S.setupDirty = true; return render();
    case 'delOverall': S.setup.overalls.splice(Number(el.dataset.i), 1); S.setupDirty = true; return render();
    case 'addSeries': S.setup.series.push({ id: uid('s'), name: 'New series', rounds: [] }); S.setupDirty = true; return render();
    case 'delSeries': {
      const s = S.setup.series[Number(el.dataset.i)];
      if (s.rounds.some(r => S.races[raceKey(S.year, r.id)]) && el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Remove? Rounds have results'; return; }
      S.setup.series.splice(Number(el.dataset.i), 1); S.setupDirty = true; return render();
    }
    case 'addRound': { const s = S.setup.series[Number(el.dataset.i)]; const n = ENG.allRounds(S.setup).length + 1; s.rounds.push({ id: uid('r'), name: 'XCO' + n, date: '', type: 'XCO', format: 'graded', grades: [], points: null }); S.setupDirty = true; return render(); }
    case 'delRound': {
      const r = S.setup.series[el.dataset.si].rounds[el.dataset.ri];
      if (S.races[raceKey(S.year, r.id)] && el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Remove? Has results'; return; }
      S.setup.series[el.dataset.si].rounds.splice(Number(el.dataset.ri), 1); S.setupDirty = true; return render();
    }
    case 'rgradeAll': { const r = S.setup.series[el.dataset.si].rounds[el.dataset.ri]; const any = !r.grades || !r.grades.length || r.grades.some(id => S.setup.grades.some(g => g.id === id)); r.grades = any ? ['none'] : []; S.setupDirty = true; return render(); }
    case 'mvRound': { const A = S.setup.series[el.dataset.si].rounds, i = Number(el.dataset.ri), j = i + Number(el.dataset.d); if (j < 0 || j >= A.length) return; [A[i], A[j]] = [A[j], A[i]]; S.setupDirty = true; return render(); }
    case 'discardSetup': S.setup = null; S.setupDirty = false; return render();
    case 'saveSetup': if (await write('seasons/' + S.year, clone(S.setup))) { S.setupDirty = false; S.setup = null; toast('Setup saved'); render(); } return;
  }
});
window.addEventListener('beforeunload', e => { if (S.dirty || S.setupDirty) { e.preventDefault(); e.returnValue = ''; } });
route();
boot();
</script></body></html>
