<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCC Race sheet test</title>

<style>
:root{--krd-grey:#414142;--krd-lime:#E3E421;--ink:#232325;--ink-2:#4A4A4D;--ink-3:#66666A;--rule:#D9D9DB;--rule-2:#EBEBEC;--field:#A8A8AC;--ground:#F3F3F2;--white:#FFFFFF;--sel:#EEEEEC;--pass-bg:#E2F0E5;--pass:#1D5A2C;--fail-bg:#F6E0DD;--fail:#8A2A1E;--bar:#E07B00;--res:#F4F4F5;--res-2:#E2E2E4}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--ground)}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--krd-grey);color:#fff;padding:20px 16px}
aside .logo{display:block}
aside .logo svg{width:180px;height:auto;display:block}
aside .sub{font-size:13px;color:#cfcfd2;margin:10px 0 20px}
aside nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin:0 0 2px;color:#fff;background:none;border:0;font:inherit;font-size:14px;cursor:pointer}
aside nav button.on{background:var(--krd-lime);color:var(--ink);font-weight:700}
aside nav button:not(.on):hover{background:#4d4d4f}
main{min-width:0}
.top{background:#fff;border-bottom:1px solid var(--rule);padding:12px 24px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.top .sp{flex:1}
.status{font-size:13px;color:var(--ink-3);align-self:center;margin-right:6px}
.status.err{color:var(--fail);font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
label.f>span{display:block}
input,select,textarea{height:44px;border:1px solid var(--field);border-radius:0;padding:0 10px;font:inherit;background:#fff;color:var(--ink);min-width:0}
input:disabled,select:disabled{background:var(--sel);color:var(--ink-2)}
input[type=checkbox]{height:20px;width:20px;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.btn{height:44px;padding:0 16px;border:1px solid var(--ink);background:#fff;font:inherit;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--ink);color:#fff}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.btn.link{border:0;background:none;text-decoration:underline;padding:0 6px}
.btn.danger{border-color:var(--fail);color:var(--fail)}
.btn:disabled{opacity:.45;cursor:default}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px}
.x:hover{color:var(--fail)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--rule);padding:0 24px;overflow-x:auto}
.tabs button{padding:12px 16px;background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button.on{border-color:var(--krd-lime);color:var(--ink);font-weight:700}
#view{padding:20px 24px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--rule);padding:18px 20px;margin-bottom:20px}
.sec+.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule-2)}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--rule);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--rule-2);padding:4px 8px;height:42px;vertical-align:middle}
td.n,th.n{text-align:right}
td.nw{white-space:nowrap}
td input,td select{height:34px}
td input.num{width:84px;text-align:right}
.gh td{background:var(--res);font-weight:700;border-top:2px solid var(--rule)}
.gh td .mute{font-weight:400}
.tag{display:inline-block;font-size:11px;padding:2px 6px;background:var(--sel);color:var(--ink-2);margin-left:6px;font-weight:600;white-space:nowrap;vertical-align:middle}
.tag.edit{background:#FFF1D6;color:#7A4A00}
.tag.bad{background:var(--fail);color:#fff}
.tag.warn{background:#FFF1D6;color:#7A4A00}
tr.flag td{background:var(--fail-bg)}
.mute{color:var(--ink-3)}
.res{background:var(--res);border:1px solid var(--rule);padding:18px 20px;position:sticky;top:12px}
.answer{background:#fff;border:1px solid var(--rule);padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.answer .big{font-size:34px;font-weight:300;line-height:1.1}
.answer .k{font-size:13px;color:var(--ink-3)}
.res table td{background:#fff}
.res th,.res td{padding:4px 6px}
.res td input.num{width:70px}
.res td .tag{display:block;margin:2px 0 0;text-align:center}
.tw{overflow-x:auto}
.res tr.lim td:last-child{box-shadow:inset -4px 0 0 var(--bar)}
.infonote,.warnnote{font-size:13px;padding:10px 12px;margin-top:12px;line-height:1.45}
.infonote{background:#fff;border-left:3px solid var(--field)}
.warnnote{background:#FFF4E0;border-left:3px solid var(--bar)}
.warnnote ul{margin:4px 0 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--sel);font-size:12px;padding:2px 2px 2px 7px;white-space:nowrap}
.chip.race{background:#E6EEF8}
.chip .x{font-size:15px;padding:0 4px}
.chip b{font-weight:600}
.bl{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bl input[type=text]{flex:1}
.handle{cursor:grab;touch-action:none;user-select:none;color:var(--ink-3);font-size:18px;padding:0 6px}
tr.drag td{background:#FFFBD0}
tr.drop td{box-shadow:inset 0 3px 0 var(--bar)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.banner{background:#FFF4E0;border-bottom:1px solid var(--rule);padding:8px 24px;font-size:13px}
dialog{border:1px solid var(--rule);padding:22px;max-width:440px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin-bottom:12px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
dialog label.c{display:flex;gap:10px;align-items:center;margin:8px 0}
.disc{font-size:12px;color:var(--ink-3);margin-top:8px}
#report{display:none}
@media (max-width:1150px){.grid{grid-template-columns:minmax(0,1fr)}.res{position:static}}
@media (max-width:760px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
 .panel{padding:14px 12px}
 td input[data-f=riderName]{width:140px!important}
 aside{padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
 aside .logo svg{width:120px}
 aside .sub{display:none}
 aside nav{display:flex;flex-wrap:wrap;gap:2px}
 aside nav button{width:auto;padding:8px 10px;font-size:13px}
 .top,#view{padding-left:12px;padding-right:12px}
 .tabs{padding:0 8px}
 .hide-sm{display:none}
}
@media print{
 @page{size:A4 portrait;margin:14mm}
 body{background:#fff;font-size:12pt}
 #app,dialog,.banner{display:none!important}
 #report{display:block}
 .page{page-break-after:always;break-after:page}
 .page:last-child{page-break-after:auto;break-after:auto}
 .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
 .rh img{height:58px}
 .rh .t{text-align:right}
 .rh .t b{font-size:16pt;display:block}
 .rh .t span{font-size:10pt}
 #report h2{font-size:14pt;margin:14px 0 6px}
 #report table{font-size:11pt}
 #report th{color:#000;border-bottom:1.5px solid #000;font-size:10pt}
 #report td{height:auto;padding:5px 6px;border-bottom:1px solid #999}
 #report .blank td{height:30px}
 #report .grp{break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
 #report ol{padding-left:22px;line-height:1.6}
 #report ol li{margin-bottom:4px}
}
</style>
</head>
<body>
<div id="app">
 <aside>
  <span class="logo" id="brandLogo"></span>
  <div class="sub">Mackay Cycling Club Race sheet</div>
  <nav id="nav">
   <button data-view="handicap">Handicap</button>
   <button data-view="scratch">Scratch race</button>
   <button data-view="tt">Time trial</button>
   <button data-view="speeds">Average speeds</button>
  </nav>
 </aside>
 <main>
  <div id="banner"></div>
  <div class="top" id="top"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
 </main>
</div>
<div id="report"></div>

<dialog id="dlgSign">
 <h2>Sign in to edit</h2>
 <label class="f"><span>Password</span><input type="password" id="signPass" autocomplete="current-password"></label>
 <div class="disc" id="signMsg"></div>
 <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="signGo">Sign in</button></div>
</dialog>

<dialog id="dlgPdf">
 <h2>Export PDF</h2>
 <p class="lead">Pick the sheets to print. In the print dialog choose Save as PDF (or your printer) and set Layout: Portrait.</p>
 <div id="pdfOpts"></div>
 <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="pdfGo">Export</button></div>
</dialog>

<input type="file" id="fileStart" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileHist" accept=".xlsx,.xls" hidden>

const SB_URL = (window.__SB_TEST && window.__SB_TEST.url) || 'https://ypcnmpnelzoxwxitwdym.supabase.co';
const SB_KEY = (window.__SB_TEST && window.__SB_TEST.key) || 'sb_publishable_GjZtxpzDLoZdcZdDCKqneg_T7TsN-xJ';
const EDIT = { pass: null };
try { EDIT.pass = sessionStorage.getItem('mcc.edit') || null; } catch (e) {}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
}
async function makeStore() {
  let sb;
  if (window.__fakeSupabase) sb = window.__fakeSupabase();
  else { if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js'); sb = window.supabase.createClient(SB_URL, SB_KEY); }
  const docs = new Map(); let onChange = () => {};
  async function loadAll() {
    const { data, error } = await sb.from('mcc_docs').select('path,data');
    if (error) throw error;
    docs.clear(); data.forEach(r => docs.set(r.path, r.data));
  }
  await loadAll();
  try {
    sb.channel('mcc_docs').on('postgres_changes', { event: '*', schema: 'public', table: 'mcc_docs' }, p => {
      if (p.eventType === 'DELETE') onChange(p.old.path, null); else onChange(p.new.path, p.new.data);
    }).subscribe();
  } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll().then(() => onChange('*')).catch(() => {}); });
  return {
    docs,
    reload: loadAll,
    onChange: f => { onChange = f; },
    check: async pass => { const { data, error } = await sb.rpc('mcc_check', { pass }); if (error) throw error; return data === true; },
    save: async (path, data) => {
      const { error } = await sb.rpc('mcc_save', { pass: EDIT.pass || '', doc_path: path, doc: data });
      if (error) throw { bad: /password/i.test(error.message || ''), message: error.message };
    },
  };
}

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => { o[key] = x[key]; return o; }, {}) : x);
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : null; };
const f2 = v => v == null || !isFinite(v) ? '–' : v.toFixed(2);
function titleCase(s) { return String(s || '').toLowerCase().replace(/(^|[\s\-'’])([a-z])/g, (m, a, b) => a + b.toUpperCase()).trim(); }
function mmss(min) { if (min == null || !isFinite(min)) return '–'; const s = Math.round(min * 60); const neg = s < 0; const a = Math.abs(s); return (neg ? '-' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0'); }
function hhmmss(min) { const s = Math.round(min * 60); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
const round30 = min => Math.round(min * 2) / 2;
function fmtDate(d) { if (!d) return ''; const t = new Date(d + 'T00:00:00'); if (isNaN(t)) return d; return t.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
function todayISO() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function clockAdd(hm, sec) { const m = /^(\d{1,2}):(\d{2})/.exec(hm || ''); if (!m) return '–'; let s = (+m[1]) * 3600 + (+m[2]) * 60 + sec; s = ((s % 86400) + 86400) % 86400; const h = Math.floor(s / 3600), mi = Math.floor(s % 3600 / 60), x = s % 60; return h + ':' + String(mi).padStart(2, '0') + (x ? ':' + String(x).padStart(2, '0') : ''); }

/* ============ Handicap ============ */
function autoGroups(race) {
  const D = num(race.dist);

}

  const map = {}; used.forEach((o, i) => { map[o] = i; });

  const exp = {}; for (const o in (race.hc.exp || {})) if (map[o] != null) exp[map[o]] = race.hc.exp[o];

}

  const g = race.hc.g;

    g[id] = best;

}
function hcGroups(race) {

  const n = Math.max(-1, ...Object.values(g)) + 1; const out = [];
  for (let i = 0; i < n; i++) {

    const sp = m.map(avgOf).filter(v => v != null);
    const ca = sp.length ? mean(sp) : null;
    const ov = race.hc.exp && race.hc.exp[i] != null ? race.hc.exp[i] : null;
    const ex = ov != null ? ov : ca;
    const t = D > 0 && ex > 0 ? D / ex * 60 : null;
    out.push({ i, m, ca, ex, edited: ov != null, t });

  const ts = out.map(x => x.t).filter(t => t != null); const mx = ts.length ? Math.max(...ts) : null;
  out.forEach(x => { x.start = x.t != null && mx != null ? round30(mx - x.t) : null; x.lim = x.t != null && x.t === mx; });
  return out;
}

/* ============ Scratch ============ */
const gradeKey = c => String(c || '').trim().toUpperCase();
function scInfo(race) {

  const gAvg = {};
  grades.forEach(gr => { const s = ids.filter(id => gradeKey(entryOf(race, id).cat) === gr).map(avgOf).filter(v => v != null); gAvg[gr] = s.length ? mean(s) : null; });
  const withAvg = grades.filter(gr => gAvg[gr] != null);

  h += '</tbody></table>';
  h += '<div class="infonote">Race time = distance ÷ expected speed × 60' + (D > 0 ? ' = ' + D + ' ÷ speed × 60' : '') + '. Start = slowest group\'s race time − this group\'s race time, rounded to the nearest 30 s. Expected speed defaults to the group\'s calculated average; type over it to adjust.</div>';
  const w = [];
  if (!(D > 0)) w.push('Enter the race distance on the Race & briefing tab.');
  G.filter(x => x.ex == null).forEach(x => w.push('Group ' + x.i + ' has no speed – enter an expected speed.'));
  G.filter(x => x.m.length === 1).forEach(x => w.push('Group ' + x.i + ' has only 1 rider.'));
  if (un.length) w.push(un.length + ' rider' + (un.length > 1 ? 's are' : ' is') + ' unassigned' + (un.some(id => avgOf(id) == null) ? ' (no recorded speeds – add one on Average speeds, or pick a group)' : '') + '.');
  if (w.length) h += '<div class="warnnote"><ul>' + w.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  return h + '</div></div>';
}

/* ============ Events ============ */
document.addEventListener('click', e => {
  const nb = e.target.closest('#nav button'); if (nb) { UI.view = nb.dataset.view; saveUI(); render(); return; }
  const cl = e.target.closest('[data-close]'); if (cl) { cl.closest('dialog').close(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type !== 'checkbox' && b.type !== 'button')) return;
  act(b.dataset.act, b);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-act]') || t.matches('input[type=checkbox][data-act]')) { if (t.type === 'checkbox') return; act(t.dataset.act, t); return; }
  if (t.dataset.f) field(t, true);
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.f && t.type !== 'checkbox') field(t, false); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'signPass') { e.preventDefault(); $('#signGo').click(); }
  else if (t.id === 'addEntrant' || t.id === 'addCat') { e.preventDefault(); act('addEntrant'); }
  else if (t.id === 'newRider') { e.preventDefault(); act('addRider'); }
  else if (t.id && t.id.startsWith('as')) { e.preventDefault(); act('addSpeed', { dataset: { id: t.id.slice(4) } }); }
});

function field(t, committed) {
  const f = t.dataset.f, r = curRace(), v = t.value;
  if (f === 'q') { UI.q = v; if (committed) return; render(); return; }
  if (!canEdit) return;
  switch (f) {
    case 'name': r.name = v; save(r); if (committed) render(); else renderTop(); break;
    case 'date': r.date = v; save(r); if (committed) render(); break;
    case 'dist': r.dist = num(v); save(r); if (committed) { if (r.type === 'handicap') { hcSync(r); save(r); } render(); } break;
    case 'laps': r.laps = num(v); save(r); break;
    case 'sharedText': { const it = S.brief.items.find(x => x.id === t.dataset.id); if (it) { it.t = v; save(S.brief); } if (committed) render(); break; }
    case 'ownText': { const it = r.brief.items.find(x => x.id === t.dataset.id); if (it) { it.t = v; save(r); } if (committed) render(); break; }
    case 'entryCat': { const e = entryOf(r, t.dataset.id); if (e) { e.cat = v.trim(); save(r); } if (committed) render(); break; }
    case 'exp': if (committed) { const x = num(v); if (x > 0) { r.hc.exp[t.dataset.g] = x; r.hc.manual = true; } else delete r.hc.exp[t.dataset.g]; save(r); render(); } break;
    case 'resPos': { const x = parseInt(v, 10); r.hc.res[t.dataset.id] = Object.assign(r.hc.res[t.dataset.id] || {}, { pos: x > 0 ? x : null }); save(r); if (committed) render(); break; }
    case 'resSpd': { const x = num(v); r.hc.res[t.dataset.id] = Object.assign(r.hc.res[t.dataset.id] || {}, { spd: x > 0 ? x : null }); save(r); if (committed) render(); break; }
    case 'ttFirst': r.tt.first = v; save(r); if (committed) render(); break;
    case 'ttInt': { const x = num(v); if (x > 0) { r.tt.interval = x; save(r); } if (committed) render(); break; }
    case 'riderName': { const rd = riderById(t.dataset.id); if (rd && v.trim()) { rd.name = v.trim(); save(S.riders); } if (committed) render(); break; }
  }
}

function act(a, el) {
  const r = curRace(); const id = el && el.dataset && el.dataset.id;
  switch (a) {
    case 'tab': UI.tab[UI.view] = el.dataset.tab; saveUI(); render(); return;
    case 'pickRace': UI.race[UI.view] = el.value || null; saveUI(); render(); return;
    case 'signIn': $('#signMsg').textContent = ''; $('#signPass').value = ''; $('#dlgSign').showModal(); $('#signPass').focus(); return;
    case 'signOut': canEdit = false; EDIT.pass = null; try { sessionStorage.removeItem('mcc.edit'); } catch (x) {} status = ''; render(); return;
    case 'pdf': openPdf(); return;
    case 'importHist': $('#fileHist').value = ''; $('#fileHist').click(); return;
    case 'importStart': $('#fileStart').value = ''; $('#fileStart').click(); return;
  }
  if (!canEdit) return;
  switch (a) {
    case 'newRace': newRace(UI.view); render(); { const n = document.querySelector('[data-k="r.name"]'); if (n) { n.focus(); n.select(); } } break;
    case 'delRace': if (confirm('Delete "' + r.name + '"? This can\'t be undone.' + (r.type === 'handicap' ? ' Its result speeds will be removed from riders\' averages.' : ''))) { delete S.races[r.id]; removeDoc('race/' + r.id); UI.race[UI.view] = null; saveUI(); render(); } break;
    case 'briefToggle': { r.brief.off = r.brief.off || []; const i = r.brief.off.indexOf(id); if (el.checked) { if (i >= 0) r.brief.off.splice(i, 1); } else if (i < 0) r.brief.off.push(id); save(r); render(); break; }
    case 'sharedAdd': { const it = { id: uid(), t: '' }; S.brief.items.push(it); save(S.brief); render(); const n = document.querySelector('[data-k="bs.' + it.id + '"]'); if (n) n.focus(); break; }
    case 'sharedDel': { const it = S.brief.items.find(x => x.id === id); if (it && (!it.t.trim() || confirm('Delete this shared point from every race?\n\n' + it.t))) { S.brief.items = S.brief.items.filter(x => x.id !== id); save(S.brief); render(); } break; }
    case 'ownAdd': { const it = { id: uid(), t: '' }; r.brief.items.push(it); save(r); render(); const n = document.querySelector('[data-k="bo.' + it.id + '"]'); if (n) n.focus(); break; }
    case 'ownDel': r.brief.items = r.brief.items.filter(x => x.id !== id); save(r); render(); break;
    case 'addEntrant': {
      const inp = $('#addEntrant'); const name = inp && inp.value.trim(); if (!name) return;
      let rd = riderByName(name); let created = false;
      if (!rd) { rd = addRider(name === name.toUpperCase() ? titleCase(name) : name); created = true; }
      addEntrant(r, rd.id, ($('#addCat').value || '').trim());
      if (created) { r.newIds = r.newIds || []; r.newIds.push(rd.id); }
      syncRace(r); save(r); render(); const n = $('#addEntrant'); if (n) n.focus(); break;
    }
    case 'rmEntrant': r.entries = r.entries.filter(e => e.rid !== id); if (r.newIds) r.newIds = r.newIds.filter(x => x !== id); syncRace(r); save(r); render(); break;
    case 'clearNew': r.newIds = []; save(r); render(); break;
    case 'regroup': if (r.hc.manual && !confirm('Re-group automatically? Your manual moves and edited speeds for this race will be cleared.')) return; autoGroups(r); hcSync(r); save(r); render(); break;
    case 'moveGroup': { const to = parseInt(el.value, 10); r.hc.g[id] = to; r.hc.manual = true; hcCompact(r); save(r); render(); break; }
    case 'expReset': delete r.hc.exp[el.dataset.g]; save(r); render(); break;
    case 'setGrade': { const req = gradeKey(entryOf(r, id).cat); if (el.value === req || !el.value) delete r.sc.grade[id]; else r.sc.grade[id] = el.value; save(r); render(); break; }
    case 'addRider': { const inp = $('#newRider'); const name = inp && inp.value.trim(); if (!name) return; if (riderByName(name)) { alertMsg(name + ' is already in the list.'); return; } addRider(name); render(); break; }
    case 'delRider': {
      const rd = riderById(id); const used = Object.values(S.races).filter(x => entryOf(x, id));
      if (!confirm('Delete ' + rd.name + ' and all their speeds?' + (used.length ? '\nThey will also be removed from ' + used.length + ' race' + (used.length > 1 ? 's' : '') + '.' : ''))) return;
      S.riders.list = S.riders.list.filter(x => x.id !== id); save(S.riders);
      used.forEach(x => { x.entries = x.entries.filter(e => e.rid !== id); syncRace(x); save(x); });
      render(); break;
    }
    case 'addSpeed': {
      const v = num(($('#asv_' + id) || {}).value); const l = '';
      if (!(v > 0)) { const n = $('#asv_' + id); if (n) n.focus(); return; }
      const rd = riderById(id); rd.speeds = rd.speeds || []; rd.speeds.push({ id: uid(), v, l }); save(S.riders); render(); break;
    }
    case 'delSpeed': { const rd = riderById(id); rd.speeds = rd.speeds.filter(s => s.id !== el.dataset.s); save(S.riders); render(); break; }
  }
}

/* ============ Imports ============ */
async function readSheet(file) {
  if (!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  return wb;
}
$('#fileStart').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return; const r = curRace(); if (!r || !canEdit) return;
  try { const wb = await readSheet(f); importStartList(r, XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' })); }
  catch (err) { setStatus('Import failed – ' + (err.message || err), true); }
});
function importStartList(r, rows) {
  const hi = rows.findIndex(row => row.some(c => /^last ?name$/i.test(String(c).trim())));
  if (hi < 0) { setStatus('Import failed – no LastName column found', true); return; }
  const H = rows[hi].map(c => String(c).trim().toLowerCase().replace(/\s+/g, ''));
  const iL = H.indexOf('lastname'), iF = H.indexOf('firstname'), iC = H.indexOf('category');
  let added = 0, created = 0; r.newIds = r.newIds || [];
  rows.slice(hi + 1).forEach(row => {
    const last = String(row[iL] || '').trim(), first = iF >= 0 ? String(row[iF] || '').trim() : '';
    if (!last && !first) return;
    const name = titleCase((first + ' ' + last).trim());
    let rd = riderByName(name);
    if (!rd) { rd = { id: uid(), name, speeds: [] }; S.riders.list.push(rd); created++; r.newIds.push(rd.id); }
    if (addEntrant(r, rd.id, iC >= 0 ? String(row[iC] || '').trim() : '')) added++;
  });
  if (created) save(S.riders);
  syncRace(r); save(r); render();
  setStatus('Imported: ' + added + ' added' + (created ? ', ' + created + ' new riders' : '') + '. Saving…');
}
$('#fileHist').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f || !canEdit) return;
  try {
    const wb = await readSheet(f);
    const sn = wb.SheetNames.find(n => /average/i.test(n)) || wb.SheetNames[0];
    importHistory(XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' }));
  } catch (err) { setStatus('Import failed – ' + (err.message || err), true); }
});
function importHistory(rows) {
  const hi = rows.findIndex(row => row.some(c => /^name$/i.test(String(c).trim())));
  if (hi < 0) { setStatus('Import failed – no Name column found', true); return; }
  const H = rows[hi].map(c => String(c).trim());
  const iN = H.findIndex(c => /^name$/i.test(c));
  const rc = H.map((c, i) => /^R\d+$/i.test(c) ? i : -1).filter(i => i >= 0);
  let nr = 0, ns = 0;
  rows.slice(hi + 1).forEach(row => {
    const name = String(row[iN] || '').trim(); if (!name) return;
    let rd = riderByName(name); if (!rd) { rd = { id: uid(), name, speeds: [] }; S.riders.list.push(rd); nr++; }
    rd.speeds = rd.speeds || [];
    rc.forEach(i => { const v = num(row[i]); if (!(v > 0)) return; const l = 'Sheet ' + H[i].toUpperCase(); if (rd.speeds.some(s => s.l === l)) return; rd.speeds.push({ id: uid(), v, l }); ns++; });
  });
  save(S.riders); render();
  setStatus('Imported ' + ns + ' speeds' + (nr ? ', ' + nr + ' new riders' : '') + '. Saving…');
}

/* ============ PDF ============ */
const SHEETS = {
  handicap: [['start', 'Start sheet'], ['brief', 'Briefing'], ['finish', 'Blank finish-order sheet']],
  scratch: [['entries', 'Entry list by grade'], ['brief', 'Briefing'], ['results', 'Blank results sheet (one per grade)']],
  tt: [['start', 'Start sheet'], ['brief', 'Briefing'], ['timing', 'Blank timing sheet']],
};
function openPdf() {
  const r = curRace(); if (!r) return; const sel = UI.pdf || {};
  $('#pdfOpts').innerHTML = SHEETS[r.type].map(([k, l]) => '<label class="c"><input type="checkbox" data-sheet="' + k + '"' + (sel[r.type + k] === false ? '' : ' checked') + '> ' + l + '</label>').join('');
  $('#dlgPdf').showModal();
}
$('#pdfGo').addEventListener('click', () => {
  const r = curRace(); UI.pdf = UI.pdf || {};
  const ks = [...document.querySelectorAll('#pdfOpts input')].filter(x => { UI.pdf[r.type + x.dataset.sheet] = x.checked; return x.checked; }).map(x => x.dataset.sheet);
  saveUI(); $('#dlgPdf').close(); if (!ks.length) return;
  $('#report').innerHTML = buildReport(r, ks);
  const old = document.title; document.title = r.name + (r.date ? ' ' + r.date : '');
  setTimeout(() => { window.print(); document.title = old; }, 50);
});
function rhead(r, title) {
  return '<div class="rh"><img src="' + MCC_LOGO + '" alt="Mackay Cycling Club"><div class="t"><b>' + esc(title) + '</b><span>' + esc(r.name) + (r.date ? ' · ' + esc(fmtDate(r.date)) : '') + (num(r.dist) ? ' · ' + num(r.dist) + ' km' : '') + (num(r.laps) ? ' (' + num(r.laps) + ' lap' + (num(r.laps) > 1 ? 's' : '') + ')' : '') + '</span></div></div>';
}
function buildReport(r, ks) {
  buildAvg(); syncRace(r);
  const pages = [];
  ks.forEach(k => {
    if (k === 'brief') pages.push(rhead(r, 'Rider briefing') + briefList(r));
    if (r.type === 'handicap' && k === 'start') {
      const G = hcGroups(r).slice().sort((a, b) => (a.start == null) - (b.start == null) || a.start - b.start || a.i - b.i);
      let h = rhead(r, 'Handicap start sheet');
      G.forEach(x => { h += '<div class="grp"><h2>Group ' + x.i + ' – start +' + mmss(x.start) + ' <span style="font-weight:400;font-size:11pt">(' + f2(x.ex) + ' km/h)</span></h2><table><thead><tr><th style="width:50%">Rider</th><th>Category</th><th style="width:16%">Present</th></tr></thead><tbody>' + x.m.map(id => '<tr><td>' + esc(riderById(id).name) + '</td><td>' + esc(entryOf(r, id).cat || '') + '</td><td></td></tr>').join('') + '</tbody></table></div>'; });
      const un = entrantIds(r).filter(id => !(r.hc.g && r.hc.g[id] >= 0));
      if (un.length) h += '<div class="grp"><h2>Unassigned</h2><table><tbody>' + un.map(id => '<tr><td>' + esc(riderById(id).name) + '</td></tr>').join('') + '</tbody></table></div>';
      pages.push(h);
    }
    if (r.type === 'handicap' && k === 'finish') {
      const n = entrantIds(r).length + 3;
      pages.push(rhead(r, 'Finish order') + '<table class="blank"><thead><tr><th style="width:12%">Pos</th><th style="width:48%">Rider</th><th style="width:20%">Group</th><th>Notes</th></tr></thead><tbody>' + Array.from({ length: n }, (_, i) => '<tr><td>' + (i + 1) + '</td><td></td><td></td><td></td></tr>').join('') + '</tbody></table>');
    }
    if (r.type === 'scratch' && k === 'entries') {
      const I = scInfo(r); let h = rhead(r, 'Entry list by grade');
      I.finals.concat(I.rows.some(x => !x.fin) ? [''] : []).forEach(gr => {
        const rows = I.rows.filter(x => x.fin === gr).sort((a, b) => riderById(a.id).name.localeCompare(riderById(b.id).name));
        if (!rows.length) return;
        h += '<div class="grp"><h2>' + (gr ? 'Grade ' + esc(gr) : 'No grade') + ' (' + rows.length + ')</h2><table><thead><tr><th style="width:60%">Rider</th><th>Present</th></tr></thead><tbody>' + rows.map(x => '<tr><td>' + esc(riderById(x.id).name) + '</td><td></td></tr>').join('') + '</tbody></table></div>';
      });
      pages.push(h);
    }
    if (r.type === 'scratch' && k === 'results') {
      const I = scInfo(r);
      (I.finals.length ? I.finals : ['']).forEach(gr => {
        const n = I.rows.filter(x => x.fin === gr).length + 3;
        pages.push(rhead(r, 'Results' + (gr ? ' – Grade ' + gr : '')) + '<table class="blank"><thead><tr><th style="width:12%">Place</th><th style="width:55%">Rider</th><th>Notes</th></tr></thead><tbody>' + Array.from({ length: n }, (_, i) => '<tr><td>' + (i + 1) + '</td><td></td><td></td></tr>').join('') + '</tbody></table>');
      });
    }
    if (r.type === 'tt' && (k === 'start' || k === 'timing')) {
      const T = r.tt; const iv = num(T.interval) || 0;
      const rows = T.order.map((id, i) => ({ i, name: riderById(id).name, cat: entryOf(r, id).cat || '', st: clockAdd(T.first, i * iv) }));
      if (k === 'start') pages.push(rhead(r, 'Time trial start sheet') + '<p>First start ' + esc(T.first || '–') + ', ' + iv + ' s interval.</p><table><thead><tr><th style="width:8%">No.</th><th style="width:50%">Rider</th><th>Category</th><th>Start time</th></tr></thead><tbody>' + rows.map(x => '<tr><td>' + (x.i + 1) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.cat) + '</td><td>' + x.st + '</td></tr>').join('') + '</tbody></table>');
      else pages.push(rhead(r, 'Time trial timing sheet') + '<table class="blank"><thead><tr><th style="width:7%">No.</th><th style="width:33%">Rider</th><th style="width:14%">Start</th><th style="width:16%">Finish</th><th style="width:16%">Time</th><th>Place</th></tr></thead><tbody>' + rows.map(x => '<tr><td>' + (x.i + 1) + '</td><td>' + esc(x.name) + '</td><td>' + x.st + '</td><td></td><td></td><td></td></tr>').join('') + '</tbody></table>');
    }
  });
  return pages.map(p => '<div class="page">' + p + '</div>').join('');
}

/* ============ Start ============ */
(async function init() {
  setStatus('Loading…'); render();
  try { Store = await makeStore(); applyDocs(); }
  catch (e) { loadErr = (e && e.message) || String(e); Store = { docs: new Map(), save: async () => { throw { message: 'not connected' }; }, check: async () => false, onChange() {} }; }
  if (EDIT.pass && !loadErr) { try { canEdit = await Store.check(EDIT.pass); } catch (e) { canEdit = false; } }
  status = '';
  Store.onChange((path, data) => {
    if (path === '*') { if (!pending.size) { applyDocs(); renderSoon(); } return; }
    if (pending.has(path)) return;
    if (lastSaved.get(path) === canon(data == null ? null : data)) return; // our own save coming back
    if (data == null) Store.docs.delete(path); else Store.docs.set(path, data);
    applyDocs(); renderSoon();
  });
  render();
})();
</script>
