<title>Garden Planner v1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%2256%2053%20508%20508%22%3E%3Crect%20x%3D%2256.62%22%20y%3D%2253.78%22%20width%3D%22507.117%22%20height%3D%22507.117%22%20fill%3D%22%23E3E421%22/%3E%3Cg%20fill%3D%22%23fff%22%3E%3Cpolygon%20points%3D%22238.084%20529.72%20155.219%20446.854%20237.891%20364.18%20194.796%20364.18%20118.271%20440.704%20118.271%20364.18%2087.796%20364.18%2087.796%20482.802%20118.101%20452.833%20194.989%20529.72%20238.084%20529.72%22/%3E%3Cpath%20d%3D%22M387.531%2C529.409l-44.055-56.629c22.844-1.497%2C40.962-19.557%2C40.962-41.602v-25.028c0-23.021-19.745-41.751-44.013-41.751h-91.827v30.475h91.827c7.464%2C0%2C13.538%2C5.059%2C13.538%2C11.276v25.028c0%2C6.217-6.074%2C11.274-13.538%2C11.274h-91.827v30.475h55.211l43.941%2C56.482h39.78Z%22/%3E%3Cpath%20d%3D%22M462.739%2C364.464h-64.437v30.929h64.437c21.444%2C0%2C38.891%2C17.448%2C38.891%2C38.891v25.34c0%2C21.444-17.448%2C38.891-38.891%2C38.891h-64.437v30.929h64.437c38.499%2C0%2C69.82-31.321%2C69.82-69.82v-25.34c0-38.499-31.321-69.82-69.82-69.82Z%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--krd-grey:#414142;--krd-lime:#E3E421;--ink:#232325;--ink-2:#4A4A4D;--ink-3:#66666A;--rule:#D9D9DB;--rule-2:#EBEBEC;--field:#A8A8AC;--ground:#F3F3F2;--white:#FFFFFF;--sel:#EEEEEC;--pass-bg:#E2F0E5;--pass:#1D5A2C;--fail-bg:#F6E0DD;--fail:#8A2A1E;--bar:#E07B00;--res:#F4F4F5;--res-2:#E2E2E4}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--ground)}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--krd-grey);color:#fff;padding:24px 20px}
aside .logo svg{width:180px;display:block}
aside .tool{margin:10px 0 28px;font-size:13px;color:#cfcfd1;letter-spacing:.04em;text-transform:uppercase}
aside nav button{display:block;width:100%;text-align:left;padding:10px 12px;color:#fff;background:none;border:0;border-left:3px solid transparent;font:inherit;cursor:pointer}
aside nav button.on{border-left-color:var(--krd-lime);background:rgba(255,255,255,.06);color:var(--krd-lime)}
aside .note{font-size:12px;color:#bdbdc0;margin-top:24px;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--rule);padding:14px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:500;margin:0 auto 0 0}
.loc{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.loc b{color:var(--ink)}
.zone{background:var(--sel);padding:4px 10px;font-size:13px}
.btn{height:40px;padding:0 14px;border:1px solid var(--field);background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--krd-grey);color:#fff;border-color:var(--krd-grey)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
main{padding:20px 24px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--rule)}
.sec{padding:18px 20px;border-bottom:1px solid var(--rule-2)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:17px;font-weight:600;margin:0 0 4px}
.sec h3.sub2{font-size:14px;font-weight:600;margin:20px 0 10px;color:var(--ink-2)}
.lead{color:var(--ink-3);font-size:13px;margin:0 0 14px;line-height:1.45}
.seg{display:inline-flex;border:1px solid var(--field);margin-bottom:14px;flex-wrap:wrap}
.seg button{height:44px;padding:0 16px;border:0;background:#fff;font:inherit;cursor:pointer;border-right:1px solid var(--field);color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--krd-grey);color:#fff}
.seg .n{font-size:12px;opacity:.7;margin-left:6px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);padding:6px 10px;font:inherit;font-size:13px;background:#fff;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--sel);border-color:var(--field)}
.plants{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{border:1px solid var(--rule);padding:12px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:var(--ink)}
.pc.sel{outline:2px solid var(--krd-grey);outline-offset:-1px}
.pc .nm{font-weight:600}
.pc .ty{font-size:12px;color:var(--ink-3);margin:2px 0 8px}
.pc .meta{font-size:12px;color:var(--ink-2)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;margin-top:8px}
.tag.ok{background:var(--pass-bg);color:var(--pass)}
.tag.soon{background:#FFF2DC;color:#7A4A00}
.tag.later{background:var(--res-2);color:var(--ink-2)}
.tag.no{background:var(--fail-bg);color:var(--fail)}
.empty{color:var(--ink-3);font-size:14px;padding:10px 0}
.res{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px}
.wx{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule-2);border-left:1px solid var(--rule-2)}
.wx div{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);padding:8px 2px;text-align:center;font-size:12px}
.wx .d{font-weight:600}
.wx .t{font-size:13px;margin:3px 0}
.wx .r{color:#2F5E8A}
.wx .hot{background:#FFF2DC}
.wx .frost{background:#E3EDF7}
.warnnote,.infonote{padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.45}
.warnnote{background:#FFF2DC;border-left:3px solid var(--bar)}
.infonote{background:var(--res);border-left:3px solid var(--field)}
.info h3{font-size:22px;font-weight:300;margin:0}
.info .sub{color:var(--ink-3);font-size:13px;margin:2px 0 12px}
table.kv{width:100%;border-collapse:collapse;font-size:14px}
table.kv td{padding:7px 0;border-bottom:1px solid var(--rule-2);vertical-align:top}
table.kv td:first-child{color:var(--ink-3);width:40%}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:14px}
.months span{font-size:10px;text-align:center;padding:5px 0;background:var(--res-2);color:var(--ink-3)}
.months span.s{background:var(--krd-lime);color:var(--ink)}
.months span.c{outline:2px solid var(--krd-grey);outline-offset:-2px}
.tip{font-size:13px;color:var(--ink-2);margin-top:12px;line-height:1.45}
.newbed{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
input[type=text],input[type=date],input[type=search],select{height:40px;border:1px solid var(--field);padding:0 10px;font:inherit;background:#fff;color:var(--ink);border-radius:0}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.bed{border:1px solid var(--rule)}
.bed header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--res);border-bottom:1px solid var(--rule)}
.bed header input{flex:1;min-width:0;height:34px;font-weight:600;background:transparent;border-color:transparent}
.bed header input:hover,.bed header input:focus{border-color:var(--field);background:#fff}
.bed header input.size{flex:0 0 110px;font-weight:400;font-size:13px}
.bed table{width:100%;border-collapse:collapse;font-size:13px}
.bed th{text-align:left;font-weight:500;color:var(--ink-3);padding:6px 10px;border-bottom:1px solid var(--rule-2)}
.bed td{padding:5px 10px;border-bottom:1px solid var(--rule-2)}
.bed td input[type=date]{height:32px;font-size:13px;padding:0 6px;width:136px}
.bed td:nth-child(3){white-space:nowrap}
.bed td.due{color:var(--pass);font-weight:600}
.bed td.past{color:var(--ink-3)}
.bed .x{border:0;background:none;color:var(--ink-3);font-size:18px;cursor:pointer;padding:0 4px}
.bed .addrow{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap}
.bed .addrow select{flex:1;min-width:120px;height:34px;font-size:13px}
.bed .addrow input{height:34px;font-size:13px;width:140px}
.disc{font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.5}
.disc a{color:var(--ink-2)}
dialog{border:1px solid var(--rule);padding:0;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(35,35,37,.4)}
dialog .sec{padding:18px 20px}
.results{display:flex;flex-direction:column;margin-top:10px}
.results button{text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--rule-2);background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.results button:hover{background:var(--sel)}
.results small{color:var(--ink-3)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.status{font-size:13px;color:var(--ink-3);margin-top:8px;min-height:18px}
@media(max-width:1150px){.grid{grid-template-columns:minmax(0,1fr)}.res{position:static}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}aside{padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}aside .logo svg{width:120px}aside .tool{margin:0}aside .note{display:none}aside nav{display:flex;width:100%}aside nav button{border-left:0;border-bottom:3px solid transparent;text-align:center}aside nav button.on{border-bottom-color:var(--krd-lime)}main{padding:16px}.top{padding:12px 16px}.wx{grid-template-columns:repeat(4,1fr)}.beds{grid-template-columns:minmax(0,1fr)}.seg{display:flex;width:100%}.seg button{flex:1;padding:0 8px}.bed td,.bed th{padding:5px 4px}.bed td input[type=date]{width:112px;padding:0 2px;font-size:12px}.bed .addrow select,.bed .addrow input{width:100%;flex:1 1 100%}}
</style>
</head>

 if(o.loc&&typeof o.loc.lat==="number"&&typeof o.loc.lon==="number")n.loc={name:String(o.loc.name||"My location"),lat:o.loc.lat,lon:o.loc.lon,zone:ZONES[o.loc.zone]?o.loc.zone:null,zw:o.loc.zw||null};
 if(["plants","beds"].includes(o.view))n.view=o.view;
 if(["now","soon","never"].includes(o.tab))n.tab=o.tab;
 if(["all","veg","fruit","herb"].includes(o.filter))n.filter=o.filter;
 if(PM[o.sel])n.sel=o.sel;
 if(Array.isArray(o.beds))n.beds=o.beds.map(b=>({id:b.id||uid(),name:String(b.name||"Bed"),size:String(b.size||""),plantings:Array.isArray(b.plantings)?b.plantings.filter(p=>PM[p.plant]&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)).map(p=>({id:p.id||uid(),plant:p.plant,date:p.date})):[]}));
 return n;
}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=clean(JSON.parse(r))}catch(e){}}

/* ---------- Plant status ---------- */
function status(p,zone,m){
 const ms=p.z[zone];
 if(!ms)return{g:"never"};
 if(ms.includes(m))return{g:"now"};
 for(let k=1;k<=11;k++){const mm=(m-1+k)%12+1;if(ms.includes(mm))return{g:"soon",k,from:mm}}
 return{g:"never"};
}
function groups(){
 const z=S.loc&&S.loc.zone, m=curMonth(), g={now:[],soon:[],later:[],never:[]};
 if(!z)return g;
 P.forEach(p=>{if(S.filter!=="all"&&p.t!==S.filter)return;const s=status(p,z,m);
  if(s.g==="soon")(s.k<=2?g.soon:g.later).push([p,s]);else g[s.g].push([p,s])});
 g.soon.sort((a,b)=>a[1].k-b[1].k||a[0].n.localeCompare(b[0].n));
 g.later.sort((a,b)=>a[1].k-b[1].k||a[0].n.localeCompare(b[0].n));
 g.now.sort((a,b)=>a[0].n.localeCompare(b[0].n));g.never.sort((a,b)=>a[0].n.localeCompare(b[0].n));
 return g;
}

/* ---------- Render ---------- */
function render(){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
 $("title").textContent=S.view==="plants"?"What to plant — "+["January","February","March","April","May","June","July","August","September","October","November","December"][curMonth()-1]:"My garden beds";
 const L=S.loc;
 $("loc").innerHTML=L?"📍 <b>"+esc(L.name)+"</b>"+(L.zone?' <span class="zone">'+ZONES[L.zone]+" zone</span>":' <span class="zone">Working out zone…</span>'):"No location set";
 S.view==="plants"?renderPlants():renderBeds();
}
function card(p,s){
 let tag="";
 if(s.g==="now")tag='<span class="tag ok">Plant now</span>';
 else if(s.g==="soon")tag='<span class="tag '+(s.k<=2?"soon":"later")+'">From '+MON[s.from-1]+"</span>";
 else tag='<span class="tag no">Not for this zone</span>';
 return '<button class="pc'+(S.sel===p.id?" sel":"")+'" data-plant="'+p.id+'"><div class="nm">'+esc(p.n)+'</div><div class="ty">'+TYPES[p.t]+" · "+esc(p.m)+'</div><div class="meta">'+(p.sun==="Full"?"Full sun":"Part shade OK")+" · Water: "+p.w+"</div>"+tag+"</button>";
}
function renderPlants(){
 const main=$("main");
 if(!S.loc){main.innerHTML='<div class="panel"><div class="sec"><h2>Set your location</h2><p class="lead">The planner needs your location to work out your climate zone and local weather.</p><button class="btn pri" data-act="openloc">Set location</button></div></div>'+disc();return}
 if(!S.loc.zone){main.innerHTML='<div class="panel"><div class="sec"><h2>Working out your climate zone…</h2><p class="lead">Checking the last 12 months of weather for '+esc(S.loc.name)+".</p></div></div>"+disc();return}
 const g=groups();
 const cnt={now:g.now.length,soon:g.soon.length+g.later.length,never:g.never.length};
 let list="";
 if(S.tab==="now")list=g.now.length?'<div class="plants">'+g.now.map(x=>card(...x)).join("")+"</div>":'<p class="empty">Nothing in this group for '+MON[curMonth()-1]+".</p>";
 else if(S.tab==="soon"){
  list=(g.soon.length?'<div class="plants">'+g.soon.map(x=>card(...x)).join("")+"</div>":'<p class="empty">No sowing windows open in the next two months.</p>');
  if(g.later.length)list+='<h3 class="sub2">Later in the year</h3><div class="plants">'+g.later.map(x=>card(...x)).join("")+"</div>";
 } else list=g.never.length?'<p class="lead">These don\'t suit the '+ZONES[S.loc.zone].toLowerCase()+' climate.</p><div class="plants">'+g.never.map(x=>card(...x)).join("")+"</div>":'<p class="empty">Everything in this list can be grown in your zone.</p>';
 const seg=[["now","Plant now"],["soon","Plant soon"],["never","Never plant"]].map(([k,l])=>'<button data-tab="'+k+'" aria-pressed="'+(S.tab===k)+'">'+l+'<span class="n">'+cnt[k]+"</span></button>").join("");
 const fil=[["all","All"],["veg","Vegetables"],["fruit","Fruit"],["herb","Herbs"]].map(([k,l])=>'<button class="chip" data-filter="'+k+'" aria-pressed="'+(S.filter===k)+'">'+l+"</button>").join("");
 main.innerHTML='<div class="grid"><div class="panel"><div class="sec"><h2>Plants for your zone</h2><p class="lead">Based on the '+ZONES[S.loc.zone].toLowerCase()+" sowing calendar for "+MON[curMonth()-1]+'. Click a plant for details.</p><div class="seg">'+seg+'</div><div class="filters">'+fil+"</div>"+list+'</div></div><div class="res"><div class="panel" id="wxPanel">'+wxHTML()+'</div><div class="panel info" id="infoPanel">'+infoHTML()+"</div></div></div>"+disc();
}
function infoHTML(){
 const p=PM[S.sel];
 if(!p)return'<div class="sec"><h2>Plant details</h2><p class="lead">Click a plant to see its sun, water and spacing needs and when to sow it in your zone.</p></div>';
 const z=S.loc.zone, ms=p.z[z]||[], m=curMonth(), s=status(p,z,m);
 const when=s.g==="now"?"In season — sow now":s.g==="soon"?"Next window opens in "+MON[s.from-1]:"Not suited to the "+ZONES[z].toLowerCase()+" zone";
 const months=MI.map((l,i)=>'<span class="'+(ms.includes(i+1)?"s":"")+(i+1===m?" c":"")+'" title="'+MON[i]+'">'+l+"</span>").join("");
 return '<div class="sec"><h3>'+esc(p.n)+'</h3><div class="sub">'+TYPES[p.t]+" · "+esc(p.m)+'</div><table class="kv"><tr><td>When</td><td>'+when+"</td></tr><tr><td>Sun</td><td>"+SUN[p.sun]+"</td></tr><tr><td>Water</td><td>"+WATER[p.w]+"</td></tr><tr><td>Spacing</td><td>"+p.sp+" mm between plants</td></tr><tr><td>Sow depth</td><td>"+(p.d?p.d+" mm":"At soil level / see tip")+"</td></tr><tr><td>Time to harvest</td><td>"+p.h[0]+"–"+p.h[1]+' days from planting</td></tr></table><div class="months">'+months+'</div><p class="lead" style="margin-top:8px">Lime = sowing months for your zone. Outline = this month.</p><p class="tip">'+esc(p.tip)+"</p></div>";
}
function disc(){return'<p class="disc">General guide only — sowing times vary with local conditions, so check with your local nursery. Climate zone and forecast from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. Made by <a href="https://krdgroup.com.au" target="_blank" rel="noopener">KRD Engineering &amp; Management</a>.</p>'}

/* ---------- Weather ---------- */
const dn=s=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][pd(s).getDay()];
function runs(idx){const out=[];idx.forEach(i=>{const l=out[out.length-1];if(l&&l[l.length-1]===i-1)l.push(i);else out.push([i])});return out}
function advice(days){
 const n=[], lab=r=>dn(days[r[0]].date)+(r.length>1?"–"+dn(days[r[r.length-1]].date):"");
 const hot=runs(days.map((d,i)=>d.max>=35?i:-1).filter(i=>i>=0));
 hot.forEach(r=>n.push(["warn","<b>Heat "+lab(r)+" ("+Math.round(Math.max(...r.map(i=>days[i].max)))+" °C).</b> Hold off transplanting seedlings. Water early in the morning and shade young plants."]));
 const fr=runs(days.map((d,i)=>d.min<=2?i:-1).filter(i=>i>=0));
 fr.forEach(r=>n.push(["warn","<b>Frost risk "+lab(r)+" (low of "+Math.round(Math.min(...r.map(i=>days[i].min)))+" °C).</b> Cover tender plants overnight and don't plant out frost-tender seedlings."]));
 days.forEach(d=>{if(d.rain>=50)n.push(["warn","<b>Heavy rain "+dn(d.date)+" ("+Math.round(d.rain)+" mm).</b> Check drainage and hold off sowing fine seed until it passes."])});
 const wet=runs(days.map((d,i)=>d.rain>=10?i:-1).filter(i=>i>=0));
 wet.forEach(r=>n.push(["info","<b>"+Math.round(r.reduce((a,i)=>a+days[i].rain,0))+" mm rain "+lab(r)+".</b> Skip watering those days. Good time to sow seed straight after."]));
 const wind=runs(days.map((d,i)=>d.wind>=45?i:-1).filter(i=>i>=0));
 wind.forEach(r=>n.push(["warn","<b>Strong wind "+lab(r)+" (up to "+Math.round(Math.max(...r.map(i=>days[i].wind)))+" km/h).</b> Stake tall plants like tomatoes and corn."]));
 const tr=days.reduce((a,d)=>a+d.rain,0), am=days.reduce((a,d)=>a+d.max,0)/days.length;
 if(tr<5&&am>=28)n.push(["info","<b>Dry and warm week ("+tr.toFixed(0)+" mm rain, average high "+am.toFixed(0)+" °C).</b> Water deeply every 2–3 days and mulch to hold moisture."]);
 if(!n.length)n.push(["info","<b>No weather concerns this week.</b> Good conditions for planting."]);
 return n;
}
function wxHTML(){
 const head='<div class="sec"><h2>Weather this week</h2><p class="lead">7-day forecast for '+esc(S.loc.name)+" (Open-Meteo).</p>";
 if(Wstate==="loading"||Wstate==="idle")return head+'<p class="empty">Loading forecast…</p></div>';
 if(Wstate==="error"||!W)return head+'<div class="warnnote">Couldn\'t load the forecast right now. <button class="btn sm" data-act="retrywx">Try again</button></div></div>';
 const cells=W.map(d=>'<div class="'+(d.max>=35?"hot":d.min<=2?"frost":"")+'"><div class="d">'+dn(d.date)+'</div><div class="t">'+Math.round(d.max)+"° / "+Math.round(d.min)+'°</div><div class="r">'+Math.round(d.rain)+" mm</div></div>").join("");
 return head+'<div class="wx">'+cells+"</div>"+advice(W).map(([k,t])=>'<div class="'+(k==="warn"?"warnnote":"infonote")+'">'+t+"</div>").join("")+"</div>";
}
async function loadWeather(){
 if(!S.loc)return;
 Wstate="loading";W=null;const p=$("wxPanel");if(p)p.innerHTML=wxHTML();
 try{
  const u="https://api.open-meteo.com/v1/forecast?latitude="+S.loc.lat+"&longitude="+S.loc.lon+"&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto&forecast_days=7";
  const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json(),d=j.daily;
  W=d.time.map((t,i)=>({date:t,max:+d.temperature_2m_max[i]||0,min:+d.temperature_2m_min[i]||0,rain:+d.precipitation_sum[i]||0,wind:+d.wind_speed_10m_max[i]||0}));
  Wstate="ok";
 }catch(e){Wstate="error"}
 const q=$("wxPanel");if(q)q.innerHTML=wxHTML();
}

/* ---------- Climate zone ---------- */
function zoneFrom(coldMin,rain){
 if(rain<400)return"arid";
 if(coldMin<5)return"cool";
 if(coldMin<9)return"temp";
 if(coldMin<11)return"sub";
 return"trop";
}
function zoneFallback(lat){return lat>=-19.5?"trop":lat>=-28?"sub":lat>=-40?"temp":"cool"}
async function findZone(){
 const L=S.loc;if(!L)return;
 const end=addDays(new Date(),-7),start=addDays(end,-364);
 const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 try{
  const u="https://archive-api.open-meteo.com/v1/archive?latitude="+L.lat+"&longitude="+L.lon+"&start_date="+iso(start)+"&end_date="+iso(end)+"&daily=temperature_2m_min,precipitation_sum&timezone=auto";
  const r=await fetch(u);if(!r.ok)throw 0;const d=(await r.json()).daily;
  const sum=Array(12).fill(0),c=Array(12).fill(0);let rain=0;
  d.time.forEach((t,i)=>{const m=+t.slice(5,7)-1,v=d.temperature_2m_min[i];if(v!=null){sum[m]+=v;c[m]++}rain+=+d.precipitation_sum[i]||0});
  const means=sum.map((s,i)=>c[i]?s/c[i]:null).filter(v=>v!=null);
  const cold=Math.min(...means);
  L.zone=zoneFrom(cold,rain);
  L.zw="Worked out from the last 12 months of weather: coldest month average low "+cold.toFixed(1)+" °C, rainfall "+Math.round(rain).toLocaleString()+" mm.";
 }catch(e){L.zone=zoneFallback(L.lat);L.zw="Estimated from latitude (climate data couldn't be loaded)."}
 save();render();
}
async function setLoc(name,lat,lon){
 S.loc={name,lat:+lat.toFixed(4),lon:+lon.toFixed(4),zone:null,zw:null};
 save();if($("locDlg").open)$("locDlg").close();S.view="plants";render();
 loadWeather();await findZone();
}

/* ---------- Location dialog ---------- */
function openLoc(){$("locStatus").textContent=S.loc&&S.loc.zw?S.loc.zw:"";$("results").innerHTML="";const d=$("locDlg");if(d.showModal)d.showModal();else d.setAttribute("open","")}
function useGeo(){
 const st=$("locStatus");
 if(!navigator.geolocation){st.textContent="Location isn't available in this browser — search for your town instead.";return}
 st.textContent="Getting your location…";
 navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude,lon=pos.coords.longitude;let name="My location";
  try{const r=await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=en");const j=await r.json();
   const town=j.locality||j.city,sc=(j.principalSubdivisionCode||"").replace("AU-","");if(town)name=town+(sc?" "+sc:"")}catch(e){}
  setLoc(name,lat,lon);
 },()=>{st.textContent="Location was blocked or unavailable — search for your town instead."},{timeout:15000,maximumAge:600000});
}
async function search(){
 const q=$("q").value.trim(),st=$("locStatus"),res=$("results");
 if(q.length<2){st.textContent="Type at least two letters.";return}
 st.textContent="Searching…";res.innerHTML="";
 try{
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=8&language=en&countryCode=AU");
  const j=await r.json(),list=j.results||[];
  st.textContent=list.length?"Pick your location:":"No places found in Australia for that name.";
  res.innerHTML=list.map((p,i)=>'<button data-i="'+i+'">'+esc(p.name)+" <small>"+esc([p.admin1,p.postcodes&&p.postcodes[0]].filter(Boolean).join(" "))+"</small></button>").join("");
  res.querySelectorAll("button").forEach(b=>b.onclick=()=>{const p=list[+b.dataset.i];const ab={"Queensland":"QLD","New South Wales":"NSW","Victoria":"VIC","Tasmania":"TAS","South Australia":"SA","Western Australia":"WA","Northern Territory":"NT","Australian Capital Territory":"ACT"}[p.admin1]||"";setLoc(p.name+(ab?" "+ab:""),p.latitude,p.longitude)});
 }catch(e){st.textContent="Search isn't working right now — try again shortly."}
}

/* ---------- Beds ---------- */
function harvest(pl){
 const p=PM[pl.plant],d=pd(pl.date),a=addDays(d,p.h[0]),b=addDays(d,p.h[1]+21),t=pd(todayISO());
 if(t<a)return["","From "+fmt(a)];
 if(t<=b)return["due","Ready now"];
 return["past","Finished?"];
}
function renderBeds(){
 const opts=P.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(p=>'<option value="'+p.id+'">'+esc(p.n)+"</option>").join("");
 const beds=S.beds.map(b=>{
  const rows=b.plantings.slice().sort((x,y)=>x.date.localeCompare(y.date)).map(pl=>{const h=harvest(pl);return'<tr><td>'+esc(PM[pl.plant].n)+'</td><td><input type="date" value="'+pl.date+'" data-pdate="'+b.id+"|"+pl.id+'" aria-label="Planted date"></td><td class="'+h[0]+'">'+h[1]+'</td><td style="text-align:right"><button class="x" title="Remove planting" data-prem="'+b.id+"|"+pl.id+'">×</button></td></tr>'}).join("");
  return'<div class="bed"><header><input type="text" value="'+esc(b.name)+'" data-bname="'+b.id+'" aria-label="Bed name"><input type="text" class="size" value="'+esc(b.size)+'" placeholder="Size" data-bsize="'+b.id+'" aria-label="Bed size"><button class="x" title="Delete bed" data-bdel="'+b.id+'">×</button></header><table><tr><th>Plant</th><th>Planted</th><th>Harvest</th><th></th></tr>'+(rows||'<tr><td colspan="4" class="past">Nothing planted yet.</td></tr>')+'</table><div class="addrow"><select id="ap-'+b.id+'" aria-label="Plant">'+opts+'</select><input type="date" id="ad-'+b.id+'" value="'+todayISO()+'" aria-label="Date planted"><button class="btn sm pri" data-padd="'+b.id+'">Add planting</button></div></div>';
 }).join("");
 $("main").innerHTML='<div class="panel"><div class="sec"><h2>My garden beds</h2><p class="lead">What\'s in each bed and when it\'s due. Saved in this browser — use Save to keep a copy or move it to another device.</p><div class="newbed"><input type="text" id="nbName" placeholder="Bed name, e.g. Back fence"><input type="text" id="nbSize" placeholder="Size, e.g. 2.4 × 1.2 m"><button class="btn pri" id="btnAddBed">Add bed</button></div>'+(beds?'<div class="beds">'+beds+"</div>":'<p class="empty">No beds yet — add your first one above.</p>')+"</div></div>"+disc();
}
function findB(id){return S.beds.find(b=>b.id===id)}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.view){S.view=t.dataset.view;save();render();if(S.view==="plants"&&S.loc&&Wstate!=="ok")loadWeather();return}
 if(t.dataset.tab){S.tab=t.dataset.tab;save();render();return}
 if(t.dataset.filter){S.filter=t.dataset.filter;save();render();return}
 if(t.dataset.plant){S.sel=t.dataset.plant;save();document.querySelectorAll(".pc").forEach(c=>c.classList.toggle("sel",c.dataset.plant===S.sel));$("infoPanel").innerHTML=infoHTML();return}
 if(t.dataset.act==="openloc"){openLoc();return}
 if(t.dataset.act==="retrywx"){loadWeather();return}
 if(t.id==="btnAddBed"){const n=$("nbName").value.trim()||"Bed "+(S.beds.length+1);S.beds.push({id:uid(),name:n,size:$("nbSize").value.trim(),plantings:[]});save();render();return}
 if(t.dataset.bdel){const b=findB(t.dataset.bdel);if(b&&confirm('Delete "'+b.name+'" and everything logged in it?')){S.beds=S.beds.filter(x=>x!==b);save();render()}return}
 if(t.dataset.padd){const b=findB(t.dataset.padd),pl=$("ap-"+b.id).value,dt=$("ad-"+b.id).value;if(!dt)return;b.plantings.push({id:uid(),plant:pl,date:dt});save();render();return}
 if(t.dataset.prem){const[bid,pid]=t.dataset.prem.split("|"),b=findB(bid);b.plantings=b.plantings.filter(p=>p.id!==pid);save();render();return}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.bname){findB(t.dataset.bname).name=t.value.trim()||"Bed";save();return}
 if(t.dataset.bsize){findB(t.dataset.bsize).size=t.value.trim();save();return}
 if(t.dataset.pdate&&t.value){const[bid,pid]=t.dataset.pdate.split("|");findB(bid).plantings.find(p=>p.id===pid).date=t.value;save();render();return}
});
$("btnLoc").onclick=openLoc;
$("btnGeo").onclick=useGeo;
$("btnSearch").onclick=search;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();search()}});
$("btnClose").onclick=()=>$("locDlg").close?$("locDlg").close():$("locDlg").removeAttribute("open");
$("btnSave").onclick=()=>{
 const data={type:"krd-garden-planner",version:1,saved:new Date().toISOString(),calc:S};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="garden-planner-"+todayISO()+".json";document.body.appendChild(a);a.click();a.remove();
};
$("btnImport").onclick=()=>$("fileIn").click();
$("fileIn").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());if(j.type!=="krd-garden-planner")throw 0;S=clean(j.calc);save();render();if(S.loc){loadWeather();if(!S.loc.zone)findZone()}}
 catch(err){alert("That file isn't a Garden Planner save file.")}
 e.target.value="";
};

/* ---------- Start ---------- */
load();render();
if(S.loc){loadWeather();if(!S.loc.zone)findZone()}
else{openLoc();useGeo()}
</script>
</body>
