<style>
  :root{
    --grey:#414142;
    --grey-soft:#5c5c5e;
    --lime:#e3e421;
    --paper:#fafaf8;
    --line:#e4e3dd;
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--grey);font-family:var(--font);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .logo-mark{display:flex;align-items:center;gap:10px;text-decoration:none;margin-bottom:48px;}
  .logo-icon{height:40px;width:40px;display:block;}
  .logo-text{font-size:12px;font-weight:500;line-height:1.3;color:var(--grey-soft);text-align:left;}
  .logo-plus{color:var(--lime);}
  .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--grey-soft);margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:center;
  }
  .eyebrow::before{content:'';width:16px;height:2px;background:var(--lime);}
  h1{font-size:clamp(48px,9vw,96px);font-weight:700;margin:0;line-height:1;}
  p{color:var(--grey-soft);font-size:16.5px;max-width:46ch;margin:16px 0 32px;}
  .btn-primary{
    background:var(--grey);color:var(--paper);
    padding:14px 26px;font-size:14px;font-weight:600;
    text-decoration:none;border:1px solid var(--grey);
    transition:transform 0.15s ease,background 0.15s ease,color 0.15s ease;
    display:inline-block;
  }
  .btn-primary:hover{background:var(--lime);color:var(--grey);border-color:var(--grey);transform:translateY(-3px);}
</style>
</head>
